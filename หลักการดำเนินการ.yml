บทที่ 1
ความรู้เบื้องต้นเกี่ยวกับกฎหมายและระบบกฎหมาย
วัตถุประสงค์การเรียนรู้
หลังจากอ่านบทนี้จบแล้ว คุณควรจะสามารถทำสิ่งต่อไปนี้ได้:

แยกแยะความแตกต่างระหว่างปรัชญากฎหมายต่างๆ—สำนักคิดทางกฎหมาย—และอธิบายความสำคัญของแต่ละปรัชญา
ระบุเป้าหมายต่างๆ ที่ระบบกฎหมายที่มีประสิทธิภาพสามารถตอบสนองได้
อธิบายความสัมพันธ์ระหว่างการเมืองและกฎหมาย
ระบุแหล่งที่มาของกฎหมายและกฎหมายใดมีลำดับความสำคัญเหนือกว่ากฎหมายอื่น
ทำความเข้าใจความแตกต่างพื้นฐานบางประการระหว่างระบบกฎหมายของสหรัฐอเมริกาและระบบกฎหมายของประเทศอื่นๆ
กฎหมายมีทั้งความหมายและหน้าที่ที่แตกต่างกัน นักปรัชญาได้พิจารณาประเด็นเรื่องความยุติธรรมและกฎหมายมานานหลายศตวรรษ และได้เกิดแนวทางหรือสำนักคิดทางกฎหมายที่แตกต่างกันหลายสำนัก ในบทนี้ เราจะพิจารณาความหมายและแนวทางที่แตกต่างกันเหล่านั้น และจะพิจารณาว่าพลวัตทางสังคมและการเมืองมีปฏิสัมพันธ์กับแนวคิดที่ขับเคลื่อนสำนักคิดทางกฎหมายต่างๆ อย่างไร นอกจากนี้ เราจะพิจารณาแหล่งที่มาของ “กฎหมายลายลักษณ์อักษร” ทั่วไปในสหรัฐอเมริกา และวิธีที่แหล่งที่มาบางแหล่งมีลำดับความสำคัญเหนือกว่าแหล่งอื่นๆ และเราจะกำหนดความแตกต่างพื้นฐานบางประการระหว่างระบบกฎหมายของสหรัฐอเมริกาและระบบกฎหมายอื่นๆ

1.1กฎหมายคืออะไร?
คำว่า "กฎหมาย " มีความหมายแตกต่างกันไปในแต่ละสถานการณ์พจนานุกรมกฎหมายของแบล็ก (Black's Law Dictionary ) กล่าวว่า กฎหมายคือ “ชุดของกฎเกณฑ์การกระทำหรือพฤติกรรมที่กำหนดโดยหน่วยงานที่มีอำนาจควบคุม และมีผลผูกพันทางกฎหมาย สิ่งที่พลเมืองต้องปฏิบัติตามและเชื่อฟัง ซึ่งอาจนำไปสู่บทลงโทษหรือผลทางกฎหมาย คือ กฎหมาย” ( Black's Law Dictionary , ฉบับที่ 6, sv “law.”)

หน้าที่ของกฎหมาย
ในประเทศหนึ่ง กฎหมายสามารถทำหน้าที่ (1) รักษาความสงบ (2) รักษาสถานะเดิม (3) รักษาไว้ซึ่งสิทธิส่วนบุคคล (4) ปกป้องชนกลุ่มน้อยจากชนกลุ่มใหญ่ (5) ส่งเสริมความยุติธรรมทางสังคม และ (6) จัดให้มีการเปลี่ยนแปลงทางสังคมอย่างเป็นระเบียบ ระบบกฎหมายบางระบบทำหน้าที่เหล่านี้ได้ดีกว่าระบบอื่นๆ แม้ว่าประเทศที่ปกครองโดยรัฐบาลเผด็จการอาจรักษาความสงบและรักษาสถานะเดิมได้ แต่ก็อาจกดขี่ชนกลุ่มน้อยหรือฝ่ายตรงข้ามทางการเมืองได้เช่นกัน (เช่น พม่า ซิมบับเว หรืออิรักภายใต้ซัดดัม ฮุสเซน) ในยุคอาณานิคม ประเทศในยุโรปมักจะบังคับใช้สันติภาพในประเทศที่มีพรมแดนถูกกำหนดขึ้นอย่างค่อนข้างตามอำเภอใจโดยประเทศเหล่านั้นเอง ในช่วงหลายศตวรรษก่อนศตวรรษที่ 20 จักรวรรดิถูกสร้างขึ้นโดยสเปน โปรตุเกส อังกฤษ เนเธอร์แลนด์ ฝรั่งเศส เยอรมนี เบลเยียม และอิตาลี ในส่วนของหน้าที่ของกฎหมาย จักรวรรดิอาจรักษาความสงบได้—ส่วนใหญ่ด้วยกำลัง—แต่ได้เปลี่ยนแปลงสถานะเดิมและแทบจะไม่ส่งเสริมสิทธิของชนพื้นเมืองหรือความยุติธรรมทางสังคมภายในประเทศที่ถูกยึดครองเลย

ในประเทศที่เคยเป็นอาณานิคมของประเทศในยุโรป กลุ่มชาติพันธุ์และชนเผ่าต่างๆ มักทำให้การปกครองโดยรัฐบาลเดียวที่เป็นเอกภาพเป็นไปได้ยาก ตัวอย่างเช่น ในรวันดา การแย่งชิงอำนาจระหว่างชาวฮูตูและชาวทุตซีส่งผลให้เกิดการฆ่าล้างเผ่าพันธุ์ชนกลุ่มน้อยชาวทุตซี (การฆ่าล้างเผ่าพันธุ์คือการฆ่าหรือการขับไล่กลุ่มคนกลุ่มหนึ่งโดยกลุ่มคนอีกกลุ่มหนึ่งอย่างจงใจและเป็นระบบ ในปี 1948 ประชาคมระหว่างประเทศได้ประณามอาชญากรรมการฆ่าล้างเผ่าพันธุ์อย่างเป็นทางการ) ในประเทศต่างๆ ของอดีตสหภาพโซเวียต การถอนตัวของอำนาจส่วนกลางทำให้เกิดสุญญากาศทางอำนาจซึ่งถูกใช้ประโยชน์โดยผู้นำกลุ่มชาติพันธุ์ เมื่อยูโกสลาเวียแตกแยก กลุ่มชาติพันธุ์ต่างๆ เช่น ชาวโครเอเชีย ชาวบอสเนีย และชาวเซอร์เบีย ต่างต่อสู้กันอย่างดุเดือดเพื่อแย่งชิงดินแดนแทนที่จะแบ่งปันอำนาจ ในอิรักและอัฟกานิสถาน การผสมผสานอย่างมีประสิทธิภาพของกลุ่มครอบครัว ชนเผ่า นิกาย และกลุ่มชาติพันธุ์ต่างๆ เข้าเป็นองค์กรปกครองระดับชาติที่แบ่งปันอำนาจยังคงเป็นสิ่งที่ต้องพิสูจน์ต่อไป

กฎหมายและการเมือง
ในสหรัฐอเมริกา สมาชิกสภานิติบัญญัติ ผู้พิพากษา หน่วยงานบริหาร ผู้ว่าการรัฐ และประธานาธิบดี เป็นผู้บัญญัติกฎหมาย โดยได้รับอิทธิพลอย่างมากจากบริษัทต่างๆ กลุ่มล็อบบี้ และองค์กรไม่แสวงหาผลกำไร (NGO) ที่หลากหลาย เช่น สถาบันปิโตรเลียมแห่งอเมริกา สโมสรเซียร์รา และสมาคมปืนไรเฟิลแห่งชาติ ใน 50 รัฐ ผู้พิพากษามักได้รับการแต่งตั้งโดยผู้ว่าการรัฐหรือได้รับการเลือกตั้งจากประชาชน กระบวนการเลือกตั้งผู้พิพากษาระดับรัฐมีความเกี่ยวข้องกับการเมืองมากขึ้นเรื่อยๆ ในช่วง 15 ปีที่ผ่านมา โดยมีการบริจาคเงินสนับสนุนการหาเสียงเพิ่มมากขึ้นจากผู้ที่ต้องการแต่งตั้งผู้พิพากษาที่มีแนวคิดทางการเมืองคล้ายคลึงกัน

ในระบบสหพันธรัฐ ผู้พิพากษาได้รับการแต่งตั้งโดยผู้มาจากการเลือกตั้ง (ประธานาธิบดี) และได้รับการยืนยันโดยผู้มาจากการเลือกตั้งคนอื่นๆ (วุฒิสภา) หากประธานาธิบดีมาจากพรรคหนึ่งและอีกพรรคหนึ่งครองเสียงข้างมากในวุฒิสภา ความขัดแย้งทางการเมืองอาจเกิดขึ้นในระหว่างกระบวนการยืนยันผู้พิพากษา การแบ่งแยกเช่นนี้เกิดขึ้นค่อนข้างบ่อยในช่วงห้าสิบปีที่ผ่านมา

ในรัฐชาติ ส่วนใหญ่ (ซึ่งเป็นคำที่ใช้เรียกประเทศในกฎหมายระหว่างประเทศ) การรู้ว่าใครมีอำนาจในการออกและบังคับใช้กฎหมายนั้นขึ้นอยู่กับการรู้ว่าใครมีอำนาจทางการเมือง ในหลายแห่ง บุคคลหรือกลุ่มที่มีอำนาจทางทหารก็สามารถควบคุมอำนาจทางการเมืองในการออกและบังคับใช้กฎหมายได้เช่นกัน การปฏิวัติเป็นเรื่องยากและก่อให้เกิดความขัดแย้ง แต่ในแต่ละปีก็มีการลุกฮือต่อต้านอำนาจทางการเมืองและกฎหมายที่มีอยู่ ความปรารถนาที่จะมีระบอบประชาธิปไตย หรือ “สิทธิ” ที่มากขึ้นสำหรับพลเมือง เป็นประเด็นที่เกิดขึ้นซ้ำๆ ในการเมืองและกฎหมาย

ประเด็นสำคัญ
กฎหมายเป็นผลมาจากการกระทำทางการเมือง และสภาพแวดล้อมทางการเมืองในแต่ละประเทศนั้นแตกต่างกันอย่างมาก รัฐบาลที่ไม่มั่นคงหรือเผด็จการมักไม่สามารถปฏิบัติหน้าที่หลักของกฎหมายได้

แบบฝึกหัด
ลองพิจารณาประเทศพม่า (ซึ่งผู้ปกครองทางทหารตั้งชื่อว่าเมียนมาร์) คุณมีสิทธิทางการเมืองอะไรบ้างที่พลเมืองพม่าทั่วไปไม่มี?
องค์กรไม่แสวงหาผลกำไรคืออะไร และเกี่ยวข้องกับรัฐบาลอย่างไร คุณบริจาคเงินให้ (หรือมีส่วนร่วมใน) องค์กรไม่แสวงหาผลกำไรหรือไม่ องค์กรเหล่านั้นสนับสนุนสิทธิประเภทใด สนับสนุนกฎหมายประเภทใด และต่อต้านกฎหมายประเภทใด
1.2สำนักคิดทางกฎหมาย
วัตถุประสงค์การเรียนรู้
แยกแยะความแตกต่างระหว่างปรัชญากฎหมายต่างๆ—สำนักคิดทางกฎหมาย—และอธิบายความสำคัญของแต่ละปรัชญา
อธิบายว่าเหตุใดกฎธรรมชาติจึงเกี่ยวข้องกับสิทธิที่ผู้ก่อตั้งระบบการเมืองและกฎหมายของสหรัฐอเมริกาเห็นว่ามีความสำคัญ
อธิบายหลักนิติศาสตร์เชิงบวก และอธิบายความแตกต่างจากกฎธรรมชาติ
จงแยกแยะความแตกต่างระหว่างการศึกษากฎหมายเชิงวิพากษ์และมุมมองกฎหมายสตรีนิยมเชิงนิเวศ กับมุมมองกฎหมายธรรมชาติและมุมมองกฎหมายปฏิฐานนิยม
มีแนวคิด (หรือปรัชญา) ที่แตกต่างกันเกี่ยวกับความหมายของกฎหมาย ปรัชญากฎหมายเรียกอีกอย่างว่านิติศาสตร์และสองแนวคิดหลักคือนิติศาสตร์เชิงบวกและกฎหมายธรรมชาติแม้ว่าจะมีแนวคิดอื่นๆ อีก (ดูหัวข้อ 1.2.3 "แนวคิดทางกฎหมายอื่นๆ" ) แต่สองแนวคิดนี้มีอิทธิพลมากที่สุดต่อวิธีคิดของผู้คนเกี่ยวกับกฎหมาย

ลัทธิกฎหมายเชิงบวก: กฎหมายในฐานะคำสั่งอธิปไตย
ดังที่จอห์น ออสติน นักปรัชญากฎหมายได้กล่าวไว้อย่างกระชับว่า “กฎหมายคือคำสั่งของอำนาจอธิปไตย” กล่าวอีกนัยหนึ่ง กฎหมายจะเป็นกฎหมายได้ก็ต่อเมื่อมาจากผู้มีอำนาจที่ได้รับการยอมรับและสามารถบังคับใช้ได้โดยผู้มีอำนาจนั้น หรืออำนาจอธิปไตย —เช่น กษัตริย์ ประธานาธิบดี หรือเผด็จการ—ผู้มีอำนาจในพื้นที่หรืออาณาเขตที่กำหนดไว้ ลัทธิปฏิฐานนิยมเป็นกระแสปรัชญาที่อ้างว่าวิทยาศาสตร์ให้ความรู้ที่แม่นยำเพียงพอที่จะมีคุณค่าเท่านั้น แต่เราจะทำอย่างไรกับปรากฏการณ์ทางสังคมของกฎหมาย?

เราสามารถตรวจสอบกฎหมาย ที่มีอยู่แล้ว —คำสั่งบริหาร ข้อบังคับ หรือคำตัดสินของศาล—ได้อย่างแม่นยำพอสมควร เพื่อหาว่ากฎหมายกล่าวไว้อย่างไร ตัวอย่างเช่น เราอาจดูที่ป้ายจำกัดความเร็วบนทางหลวงส่วนใหญ่ในสหรัฐฯ และสรุปได้ว่าความเร็วที่ “ถูกต้อง” หรือ “เหมาะสม” คือไม่เกิน 55 ไมล์ต่อชั่วโมง หรือเราอาจพิจารณาให้ลึกลงไปอีกหน่อยและหาว่ากฎหมายที่เขียนไว้นั้นมักถูกนำไปใช้อย่างไร การทำเช่นนั้น เราอาจสรุปได้ว่าโดยทั่วไปแล้วตำรวจทางหลวงส่วนใหญ่อนุญาตให้ขับด้วยความเร็ว 61 ไมล์ต่อชั่วโมง แต่บางครั้งก็มีคนถูกปรับเพราะขับด้วยความเร็ว 57 ไมล์ต่อชั่วโมงในเขตจำกัดความเร็ว 55 ไมล์ต่อชั่วโมง ทั้งสองแนวทางเป็นวิธีการเชิงประจักษ์ แม้ว่าจะไม่ได้เป็นวิทยาศาสตร์อย่างเข้มงวดก็ตาม แนวทางแรก คือการตรวจสอบอย่างแม่นยำว่ากฎนั้นกล่าวไว้อย่างไร บางครั้งเรียกว่าสำนักคิดทางกฎหมายแบบ “ปฏิฐานนิยม” แนวทางที่สอง ซึ่งอาศัยบริบททางสังคมและพฤติกรรมที่แท้จริงของผู้มีบทบาทหลักในการบังคับใช้กฎหมายนั้น คล้ายคลึงกับแนวคิด "สัจนิยมทางกฎหมาย" (ดูหัวข้อ 1.2.3 "สำนักคิดทางกฎหมายอื่นๆ" )

ลัทธิปฏิฐานนิยมมีข้อจำกัดและผู้ที่วิพากษ์วิจารณ์ ผู้อ่านพระคัมภีร์ใหม่คงจำได้ว่ากษัตริย์เฮโรดทรงเกรงกลัวการประสูติของพระเมสสิยาห์ จึงออกพระราชกฤษฎีกาให้สังหารเด็กชายทุกคนที่มีอายุต่ำกว่าเกณฑ์ที่กำหนด เนื่องจากเป็นคำสั่งของกษัตริย์ พระราชกฤษฎีกาจึงถูกดำเนินการ (หรือในทางกฎหมายเรียกว่า “ดำเนินการ”) สมมติว่ากลุ่มหนึ่งยึดอำนาจในสถานที่แห่งหนึ่งและออกคำสั่งว่าผู้หญิงไม่สามารถไปโรงเรียนได้ และต้องได้รับการรักษาพยาบาลจากผู้หญิงเท่านั้น แม้ว่าอาการของพวกเธอจะเป็นอันตรายถึงชีวิตและมีแพทย์หญิงน้อยมากก็ตาม สมมติอีกว่าคำสั่งนี้ถูกดำเนินการ เพียงเพราะเป็นกฎหมายและถูกบังคับใช้อย่างเข้มงวด ผู้คนที่อาศัยอยู่ในที่นั้นย่อมตั้งคำถามถึงความฉลาด ความยุติธรรม หรือความดีงามของกฎหมายดังกล่าว แต่ถึงกระนั้นมันก็เป็นกฎหมายและโดยทั่วไปก็ถูกปฏิบัติตาม เพื่อหลีกเลี่ยงผลกระทบของกฎหมาย พลเมืองจะต้องหนีออกจากประเทศไปเลย ในช่วงที่กลุ่มตาลีบันปกครองอัฟกานิสถาน ซึ่งเป็นที่มาของตัวอย่างนี้ หลายคนก็หนีออกไป

สำนักคิดกฎหมายเชิงบวกจะยอมรับคำสั่งของผู้ร่างกฎหมายว่าเป็นสิ่งที่ชอบธรรม คำถามเกี่ยวกับศีลธรรมหรือความไม่ถูกต้องทางศีลธรรมของกฎหมายนั้นจะไม่สำคัญ ในทางตรงกันข้าม สำนักคิดกฎหมายธรรมชาติจะปฏิเสธการยอมรับความชอบธรรมของกฎหมายที่ไม่สอดคล้องกับกฎธรรมชาติ กฎสากล หรือกฎแห่งพระเจ้า หากผู้ร่างกฎหมายออกคำสั่งที่ขัดต่อกฎธรรมชาติ พลเมืองจะมีความชอบธรรมทางศีลธรรมในการแสดงออกถึงการไม่เชื่อฟังทางแพ่ง ตัวอย่างเช่น ในการปฏิเสธที่จะสละที่นั่งให้แก่คนผิวขาว โรซา พาร์คส์เชื่อว่าเธอกำลังปฏิเสธที่จะปฏิบัติตามกฎหมายที่ไม่เป็นธรรม

กฎธรรมชาติ
สำนักคิดกฎธรรมชาติเน้นย้ำว่ากฎหมายควรตั้งอยู่บนระเบียบศีลธรรมสากล กฎธรรมชาติถูก "ค้นพบ" โดยมนุษย์ผ่านการใช้เหตุผลและการเลือกระหว่างสิ่งที่ดีและสิ่งที่ชั่วร้าย นี่คือคำจำกัดความของกฎธรรมชาติจากพจนานุกรมปรัชญาเคมบริดจ์ : “กฎธรรมชาติ หรือที่เรียกว่ากฎแห่งธรรมชาติในปรัชญาศีลธรรมและการเมือง คือบรรทัดฐานที่เป็นกลางหรือชุดของบรรทัดฐานที่เป็นกลางที่ควบคุมพฤติกรรมของมนุษย์ คล้ายกับกฎหมายที่บัญญัติโดยผู้ปกครองมนุษย์ แต่มีผลผูกพันกับทุกคนอย่างเท่าเทียมกัน และโดยทั่วไปเข้าใจว่าเกี่ยวข้องกับผู้บัญญัติกฎหมายเหนือมนุษย์” พจนานุกรมปรัชญาเคมบริดจ์ , sv “กฎธรรมชาติ”

ทั้งรัฐธรรมนูญของสหรัฐอเมริกาและกฎบัตรสหประชาชาติ (UN) ต่างมีความสอดคล้องกับแนวคิดกฎธรรมชาติ เนื่องจากเน้นย้ำถึงบรรทัดฐานและสิทธิที่เป็นกลางของบุคคลและชาติ คำประกาศอิสรภาพของสหรัฐอเมริกาได้รวบรวมปรัชญากฎธรรมชาติไว้ ข้อความที่ยกมาสั้น ๆ ต่อไปนี้จะช่วยให้เข้าใจถึงความเชื่อมั่นอย่างลึกซึ้งในกฎธรรมชาติของผู้ลงนามในเอกสารฉบับนั้นได้บ้าง

คำประกาศเอกฉันท์ของรัฐทั้งสิบสามแห่งของสหรัฐอเมริกา
4 กรกฎาคม พ.ศ. 2319

เมื่อเหตุการณ์ในประวัติศาสตร์มนุษยชาติทำให้จำเป็นที่ชนชาติหนึ่งจะต้องยุติความสัมพันธ์ทางการเมืองที่เชื่อมโยงพวกเขากับอีกชนชาติหนึ่ง และเพื่อที่จะดำรงสถานะที่เป็นอิสระและเท่าเทียมกันในบรรดาประเทศต่างๆ บนโลก ซึ่งเป็นสถานะที่กฎแห่งธรรมชาติและพระเจ้าแห่งธรรมชาติทรงมอบให้แก่พวกเขา การเคารพอย่างเหมาะสมต่อความคิดเห็นของมนุษยชาติเรียกร้องให้พวกเขาประกาศสาเหตุที่ผลักดันให้พวกเขาแยกตัวออกมา

เรายึดมั่นในสัจธรรมเหล่านี้ว่าเป็นสิ่งที่ประจักษ์แจ้งในตัวเอง ว่ามนุษย์ทุกคนถูกสร้างขึ้นมาอย่างเท่าเทียมกัน และได้รับสิทธิบางประการที่ไม่อาจพรากไปได้จากพระผู้สร้าง ซึ่งในบรรดาสิทธิเหล่านั้นได้แก่ ชีวิต เสรีภาพ และการแสวงหาความสุข และเพื่อที่จะคุ้มครองสิทธิเหล่านี้ รัฐบาลจึงถูกจัดตั้งขึ้นในหมู่มนุษย์ โดยได้รับอำนาจอันชอบธรรมจากความยินยอมของผู้ถูกปกครอง…

สำนักกฎหมายธรรมชาติมีอิทธิพลอย่างมากต่อความคิดทางกฎหมายของอเมริกา แนวคิดที่ว่าสิทธิบางประการนั้น “ไม่อาจโอนได้” (ดังที่ระบุไว้ในคำประกาศอิสรภาพและในงานเขียนของจอห์น ล็อค) สอดคล้องกับทัศนะทางกฎหมายนี้ บุคคลอาจมีสิทธิที่ “พระเจ้าประทานให้” หรือ “สิทธิตามธรรมชาติ” ที่รัฐบาลไม่สามารถพรากไปได้โดยชอบธรรม การปกครองโดยได้รับความยินยอมจากผู้ถูกปกครองนั้นเป็นผลลัพธ์ตามธรรมชาติของทัศนะนี้

การไม่เชื่อฟังกฎหมายอย่างสันติวิธี—ตามแบบอย่างของเฮนรี โธโร, มหาตมา คานธี หรือมาร์ติน ลูเธอร์ คิง จูเนียร์—กลายเป็นเรื่องของศีลธรรมเหนือ “กฎหมายที่ไม่เป็นธรรมชาติ” ตัวอย่างเช่น ใน “จดหมายจากเรือนจำเบอร์มิงแฮม” มาร์ติน ลูเธอร์ คิง จูเนียร์ อ้างว่าการปฏิบัติตามกฎหมายที่ไม่เป็นธรรมนั้นไม่ถูกต้องตามหลักศีลธรรม และการจงใจไม่ปฏิบัติตามกฎหมายที่ไม่เป็นธรรมนั้น แท้จริงแล้วเป็นการกระทำที่ถูกต้องตามหลักศีลธรรมซึ่งแสดงออกถึง “ความเคารพต่อกฎหมายอย่างสูงสุด”: “บุคคลที่ฝ่าฝืนกฎหมายที่จิตสำนึกบอกเขาว่าไม่เป็นธรรม และผู้ที่ยอมรับโทษจำคุกด้วยความเต็มใจเพื่อปลุกจิตสำนึกของชุมชนเกี่ยวกับความไม่เป็นธรรมนั้น แท้จริงแล้วกำลังแสดงออกถึงความเคารพต่อกฎหมายอย่างสูงสุด…ผู้ที่ฝ่าฝืนกฎหมายที่ไม่เป็นธรรมต้องทำเช่นนั้นอย่างเปิดเผย ด้วยความรัก และด้วยความเต็มใจที่จะยอมรับโทษ” มาร์ติน ลูเธอร์ คิง จูเนียร์, “จดหมายจากเรือนจำเบอร์มิงแฮม”

ในทางกลับกัน นักกฎหมายนิยมเชิงบวกจะกล่าวว่า เราไม่สามารถรู้ได้อย่างแน่นอนว่า “กฎหมายธรรมชาติ” หรือ “กฎหมายสากล” คืออะไร ในการศึกษากฎหมาย เราสามารถเรียนรู้ได้อย่างมีประสิทธิภาพที่สุดโดยการพิจารณาจากสิ่งที่กฎหมายลายลักษณ์อักษรกล่าวไว้ หรือโดยการตรวจสอบวิธีการนำไปใช้ ในทางกลับกัน นักคิดกฎหมายธรรมชาติจะโต้แย้งว่า หากเราใส่ใจในความยุติธรรม กฎหมายและทุกระบบกฎหมายจะต้องรับผิดชอบต่อมาตรฐานที่สูงกว่าบางอย่าง ไม่ว่าการกำหนดมาตรฐานนั้นจะยากเพียงใดก็ตาม

การรู้ว่ากฎหมาย “เป็นอย่างไร” นั้นง่ายกว่าการรู้ว่ากฎหมาย “ควรจะเป็นอย่างไร” ตัวอย่างเช่น กฎหมายว่าด้วยการจ้างงานอย่างเท่าเทียมกัน มีบทบัญญัติ กฎระเบียบ และคำตัดสินเฉพาะเกี่ยวกับการเลือกปฏิบัติทางเชื้อชาติ มักมีประเด็นยากๆ เกี่ยวกับการตีความและการตัดสินใจอยู่เสมอ ซึ่งเป็นเหตุผลที่ศาลจะเข้ามาแก้ไขความเห็นที่แตกต่างกัน แต่เราจะรู้ได้อย่างไรว่า “ควรจะเป็น” หรือ “ควร” ในเรื่องความเท่าเทียมกันของมนุษย์ในระดับพื้นฐานนั้นคืออะไร ตัวอย่างเช่น เราจะรู้ได้ อย่างไร ว่า “มนุษย์ทุกคนถูกสร้างมาให้เท่าเทียมกัน” (จากคำประกาศอิสรภาพ)? โดยไม่คำนึงถึงคำถามเกี่ยวกับความเท่าเทียมกันของสตรี หรือของทาส ซึ่งไม่ได้ถูกนับว่าเป็นมนุษย์ที่มีสิทธิเท่าเทียมกันในขณะที่ประกาศอิสรภาพนั้นถูกเขียนขึ้น—คำกล่าวนี้สามารถพิสูจน์ได้ด้วยหลักฐานเชิงประจักษ์หรือไม่ หรือเป็นเพียงความรู้ที่รู้มาก่อนแล้ว ( ความรู้ที่รู้มาก่อนหมายถึง “มีอยู่ในจิตใจก่อนและเป็นอิสระจากประสบการณ์”) หรือคำกล่าวเกี่ยวกับความเท่าเทียมกันเป็นเรื่องของศรัทธาหรือความเชื่อ ซึ่งไม่สามารถพิสูจน์ได้ทั้งทางวิทยาศาสตร์หรือทางเหตุผล? การสนทนาระหว่างนักทฤษฎีกฎธรรมชาติและทฤษฎีที่เน้นเชิงประจักษ์มากขึ้นเกี่ยวกับ “กฎหมายคืออะไร” จะก่อให้เกิดคำถามที่คล้ายคลึงกัน ในหนังสือเล่มนี้ เราจะมุ่งเน้นไปที่กฎหมายที่เป็นอยู่เป็นหลัก แต่ก็จะไม่ละเลยที่จะตั้งคำถามเกี่ยวกับสิ่งที่กฎหมายควรจะเป็นหรืออาจจะเป็นไปได้ด้วย

สำนักคิดทางกฎหมายอื่นๆ
สำนักกฎหมายประวัติศาสตร์เชื่อว่า สังคมควรยึดแบบอย่างจากอดีตเป็นพื้นฐานในการตัดสินทางกฎหมายในปัจจุบัน บรรทัดฐานทางกฎหมายมีความสำคัญมากกว่าข้อโต้แย้งทางศีลธรรม

สำนักคิดกฎหมายสัจนิยมเฟื่องฟูในช่วงทศวรรษ 1920 และ 1930 ในฐานะปฏิกิริยาต่อต้านสำนักคิดกฎหมายเชิงประวัติศาสตร์ นักกฎหมายสัจนิยมชี้ให้เห็นว่า เนื่องจากชีวิตและสังคมเปลี่ยนแปลงอยู่ตลอดเวลา กฎหมายและหลักการบางอย่างจึงต้องได้รับการแก้ไขหรือปรับปรุงให้ทันสมัยเพื่อให้ยังคงใช้ได้ในปัจจุบัน บริบททางสังคมของกฎหมายมีความสำคัญต่อนักกฎหมายสัจนิยมมากกว่าการนำหลักการตัดสินคดีก่อนหน้ามาใช้กับข้อพิพาททางกฎหมายในปัจจุบันหรืออนาคต แทนที่จะสมมติว่าผู้พิพากษาจะกระทำการอย่างเป็นกลางโดยหลีกเลี่ยงไม่ได้ในการใช้กฎที่มีอยู่กับข้อเท็จจริงชุดหนึ่ง นักกฎหมายสัจนิยมสังเกตว่าผู้พิพากษามีความเชื่อของตนเอง ดำเนินงานในบริบททางสังคม และจะตัดสินทางกฎหมายโดยอิงจากความเชื่อและบริบททางสังคมของตนเอง

แนวคิดสัจนิยมทางกฎหมายมีอิทธิพลต่อการเกิดขึ้นของสำนักคิดการศึกษาทางกฎหมายเชิงวิพากษ์ (Critical Legal Studies: CLS) “นักวิพากษ์” เชื่อว่าระเบียบสังคม (และกฎหมาย) ถูกครอบงำโดยผู้ที่มีอำนาจ ความมั่งคั่ง และอิทธิพล นักวิพากษ์บางคนได้รับอิทธิพลอย่างชัดเจนจากนักเศรษฐศาสตร์ คาร์ล มาร์กซ์ และทฤษฎีความยุติธรรมในการกระจาย (ดูบทที่ 2 “ความรับผิดชอบต่อสังคมขององค์กรและจริยธรรมทางธุรกิจ” ) สำนักคิด CLS เชื่อว่าคนร่ำรวยได้กดขี่หรือเอารัดเอาเปรียบผู้ที่มีฐานะยากจนกว่ามาโดยตลอด และรักษาการควบคุมทางสังคมผ่านทางกฎหมาย ด้วยเหตุนี้ คนร่ำรวยจึงได้ทำให้การกระจายสิทธิและสินค้าที่ไม่เป็นธรรมในสังคมคงอยู่ต่อไป กฎหมายคือการเมือง ดังนั้นจึงไม่เป็นกลางหรือปราศจากคุณค่า ขบวนการ CLS จะใช้กฎหมายเพื่อล้มล้างโครงสร้างลำดับชั้นของการครอบงำในสังคมสมัยใหม่

แนวคิดทางกฎหมายที่เกี่ยวข้องกับสำนัก CLS แต่แตกต่างออกไป คือ สำนักคิดสตรีนิยมเชิงนิเวศ สำนักคิดนี้เน้นย้ำ—และต้องการปรับเปลี่ยน—การครอบงำของผู้ชายที่มีมายาวนานเหนือทั้งผู้หญิงและโลกธรรมชาติ สตรีนิยมเชิงนิเวศจะกล่าวว่า ทัศนคติทางสังคมเดียวกันที่นำไปสู่การเอารัดเอาเปรียบผู้หญิง คือรากเหง้าของการเอารัดเอาเปรียบและการทำลายสิ่งแวดล้อมทางธรรมชาติของผู้ชาย พวกเขาจะกล่าวว่า การที่ผู้ชายเป็นเจ้าของที่ดินนำไปสู่ ​​“วัฒนธรรมการครอบงำ” ซึ่งผู้ชายไม่ได้เป็นเพียงผู้ดูแลรักษาสิ่งแวดล้อมที่มีอยู่หรือผู้ที่ “อยู่ใต้บังคับบัญชา” ของเขา แต่มีหน้าที่ทำให้ทุกสิ่งที่เขาควบคุมนั้น “มีผลผลิต” ทางเศรษฐกิจ ภรรยา ลูก ที่ดิน และสัตว์ ถูกตีค่าเป็นทรัพยากรทางเศรษฐกิจ และระบบกฎหมาย (จนถึงศตวรรษที่สิบเก้า) ส่วนใหญ่ให้สิทธิเฉพาะกับผู้ชายที่มีที่ดินเท่านั้น นักสตรีนิยมเชิงนิเวศจะกล่าวว่า แม้ว่าสิทธิพลเมืองและสิทธิทางการเมืองของสตรีจะเพิ่มมากขึ้น (เช่น สิทธิในการออกเสียงเลือกตั้ง) และบางประเทศจะยอมรับสิทธิของเด็กและสัตว์ รวมถึงดูแลรักษาสิ่งแวดล้อม แต่ผลพวงจากอดีตของประเทศส่วนใหญ่ยังคงยืนยันถึงความเหนือกว่าของ "ผู้ชาย" และการครอบงำของเขาเหนือทั้งธรรมชาติและผู้หญิง

ประเด็นสำคัญ
แต่ละสำนักคิดทางกฎหมายมีมุมมองเฉพาะเกี่ยวกับระบบกฎหมายว่าคืออะไร หรือควรจะเป็นอย่างไร นักทฤษฎีกฎหมายธรรมชาติเน้นสิทธิและหน้าที่ของทั้งรัฐบาลและผู้ถูกปกครอง กฎหมายลายลักษณ์อักษรถือว่ากฎหมายเป็นเพียงคำสั่งของอำนาจอธิปไตย ซึ่งเป็นอำนาจทางการเมืองที่ผู้ถูกปกครองจะต้องเชื่อฟัง งานเขียนล่าสุดในสำนักคิดทางกฎหมายต่างๆ เน้นรูปแบบการครอบงำที่มีมายาวนานของคนร่ำรวยเหนือผู้อื่น (สำนักคิด CLS) และของผู้ชายเหนือผู้หญิง (ทฤษฎีกฎหมายสตรีนิยมเชิงนิเวศ)

แบบฝึกหัด
วานดานา ชิวา วาดภาพลำธารในป่า เธอกล่าวว่าในสังคมของเรา ลำธารถูกมองว่าไร้ประโยชน์หากมันเพียงแค่มีอยู่ ทำหน้าที่ตอบสนองความต้องการน้ำของครอบครัวและชุมชนของผู้หญิง จนกว่าวิศวกรจะเข้ามาเปลี่ยนแปลงมัน อาจจะสร้างเขื่อนและใช้น้ำเพื่อผลิตไฟฟ้าพลังน้ำ เช่นเดียวกับป่า เว้นแต่จะถูกแทนที่ด้วยสวนป่าปลูกพืชเชิงเดี่ยวที่มีคุณค่าทางเศรษฐกิจ ป่าอาจมีประโยชน์มากมาย เช่น การปกป้องแหล่งน้ำใต้ดิน การสร้างออกซิเจน การให้ผลไม้ เชื้อเพลิง และวัสดุสำหรับงานฝีมือแก่ผู้อยู่อาศัยในบริเวณใกล้เคียง และการสร้างที่อยู่อาศัยสำหรับสัตว์ซึ่งเป็นทรัพยากรที่มีค่าเช่นกัน เธอวิจารณ์มุมมองที่ว่า หากไม่มีมูลค่าทางการเงินที่สามารถนำไปเพิ่มในผลิตภัณฑ์มวลรวมภายในประเทศ ป่าหรือแม่น้ำก็ไม่สามารถมองว่าเป็นทรัพยากรที่มีประโยชน์ได้ คำวิจารณ์ของเธอสะท้อนถึงแนวคิดทางกฎหมายแบบใด
อนาโตล ฟรองซ์ กล่าวว่า “กฎหมายอันทรงเกียรติของมัน ห้ามไม่ให้ทั้งคนรวยและคนจนนอนใต้สะพาน” คำกล่าวนี้เป็นตัวแทนของสำนักคิดทางกฎหมายใด
อดอล์ฟ ไอช์มันน์เป็นสมาชิกที่ภักดีของพรรคนาซีในยุคไรช์ที่สาม และทำงานอย่างหนักภายใต้รัฐบาลของฮิตเลอร์ในช่วงสงครามโลกครั้งที่สอง เพื่อรวบรวมชาวยิวไปคุมขังและสังหารหมู่ในค่ายแรงงาน เช่น เอาชวิตซ์และบูเชนวัลด์ หลังจากที่ "ทีมช่วยเหลือ" ของอิสราเอลนำตัวเขาจากอาร์เจนตินาไปยังอิสราเอล เขาถูกนำตัวขึ้นศาลในข้อหา "อาชญากรรมต่อมนุษยชาติ" ฝ่ายจำเลยของเขาอ้างว่าเขา "เพียงแค่ทำตามคำสั่ง" จงอธิบายว่าเหตุใดไอช์มันน์จึงไม่ยึดมั่นในหลักกฎหมายธรรมชาติ
1.3แนวคิดพื้นฐานและประเภทของกฎหมายลายลักษณ์อักษรของสหรัฐอเมริกา
วัตถุประสงค์การเรียนรู้
โดยทั่วไปแล้ว ให้แยกแยะความแตกต่างระหว่างกฎหมายสัญญาและกฎหมายละเมิด
พิจารณาบทบาทของกฎหมายในการสนับสนุนบรรทัดฐานทางจริยธรรมในสังคมของเรา
ทำความเข้าใจบทบาทที่แตกต่างกันของกฎหมายของรัฐและกฎหมายของรัฐบาลกลางในระบบกฎหมายของสหรัฐอเมริกา
เข้าใจความแตกต่างระหว่างคดีอาญาและคดีแพ่ง
เนื้อหาส่วนใหญ่ในหนังสือเล่มนี้เป็นกฎหมายลายลักษณ์อักษร โดยเฉพาะอย่างยิ่งกฎหมายลายลักษณ์อักษรของสหรัฐอเมริกา เราจะพิจารณากฎหมายและระบบกฎหมายของประเทศอื่นๆ ด้วย แต่ก่อนอื่น เราควรทำความเข้าใจแนวคิดพื้นฐานและความแตกต่างบางประการเสียก่อน

กฎหมาย: คุณธรรมขั้นต่ำในสังคมประชาธิปไตย
กฎหมายไม่ได้แก้ไข (หรืออ้างว่าแก้ไข) ความผิดทุกอย่างที่เกิดขึ้นในสังคม อย่างน้อยที่สุด กฎหมายมุ่งที่จะยับยั้งความผิดที่ร้ายแรงที่สุด ความผิดที่ละเมิดสิ่งที่อาจเรียกว่า “คุณธรรมขั้นต่ำ” ที่ชุมชนเรียกร้องจากสมาชิก ซึ่งรวมถึงไม่เพียงแต่การละเมิดกฎหมายอาญา (ดูบทที่ 6 “กฎหมายอาญา” ) แต่ยังรวมถึงการกระทำละเมิด (ดูบทที่ 7 “บทนำเกี่ยวกับกฎหมายละเมิด” ) และการผิดสัญญา (ดูบทที่ 8 “บทนำเกี่ยวกับกฎหมายสัญญา” ) ดังนั้น การปฏิเสธที่จะรับโทรศัพท์จากเพื่อนอาจเป็นความผิด แต่ความผิดนั้นจะไม่นำไปสู่การฟ้องร้องดำเนินคดีกับคุณได้ แต่หากมีการใช้โทรศัพท์ (หรืออินเทอร์เน็ต) เพื่อใส่ร้ายหรือหมิ่นประมาทผู้อื่น ถือเป็นการกระทำละเมิด และกฎหมายอาจอนุญาตให้ผู้ถูกใส่ร้ายได้รับการชดเชย

มีความสัมพันธ์อย่างแน่นแฟ้นระหว่างสิ่งที่เราโดยทั่วไปคิดว่าเป็นพฤติกรรมทางจริยธรรมกับสิ่งที่กฎหมายกำหนดและบัญญัติไว้ ตัวอย่างเช่น กฎหมายสัญญาสนับสนุนความรู้สึกของสังคมที่ว่าโดยทั่วไปแล้วควรปฏิบัติตามสัญญา การผิดสัญญาถือว่าไม่ถูกต้องตามหลักจริยธรรม กฎหมายให้การเยียวยาสำหรับการผิดสัญญา (ในกรณีการละเมิดสัญญา) แต่ไม่ใช่สำหรับการผิดสัญญาทุกกรณี บางกรณีอาจยอมรับข้อแก้ตัวได้เมื่อสมเหตุสมผล สำหรับกฎหมายละเมิด การทำร้ายผู้อื่นถือว่าไม่ถูกต้องตามหลักจริยธรรม หากกฎหมายไม่ห้ามไม่ให้ผู้คนทำร้ายกัน สังคมที่เป็นระเบียบก็จะพังทลายลง นำไปสู่ความอนาธิปไตย กฎหมายละเมิดให้การชดเชยเมื่อเกิดการบาดเจ็บหรืออันตรายร้ายแรง ส่วนประเด็นเกี่ยวกับกฎหมายทรัพย์สิน โดยทั่วไปเราเชื่อว่าการเป็นเจ้าของทรัพย์สินส่วนตัวมีประโยชน์ต่อสังคมและเป็นที่พึงปรารถนาโดยทั่วไป และโดยทั่วไปได้รับการคุ้มครอง (โดยมีข้อยกเว้นบางประการ) โดยกฎหมาย คุณไม่สามารถจัดงานเลี้ยงที่บ้านของฉันโดยไม่ได้รับอนุญาตจากฉัน แต่สิทธิของฉันที่จะทำอะไรก็ได้บนทรัพย์สินของฉันเองอาจถูกจำกัดโดยกฎหมาย ฉันไม่สามารถดำเนินการเผาขยะในที่ดินของฉันโดยไม่ได้รับอนุญาตจากประชาชน และเผาโลหะหนักได้ เนื่องจากเถ้าพิษอาจฟุ้งกระจายไปทั่วบริเวณใกล้เคียง

กฎหมายทั่วไป: ทรัพย์สิน การละเมิด และสัญญา
แม้ก่อนที่สภานิติบัญญัติจะประชุมกันเพื่อออกกฎเกณฑ์สำหรับสังคม ข้อพิพาทก็เกิดขึ้นและผู้พิพากษาได้ตัดสินไปแล้ว ในอังกฤษ ผู้พิพากษาเริ่มจดบันทึกข้อเท็จจริงของคดีและเหตุผลในการตัดสิน พวกเขามักจะตัดสินคดีโดยอาศัยคำตัดสินที่เขียนไว้ก่อนหน้านี้ โดยอาศัยคำตัดสินก่อนหน้านี้ ผู้พิพากษาจะให้เหตุผลว่า เนื่องจากคดีปัจจุบันค่อนข้างคล้ายกับคดีก่อนหน้านี้ จึงควรตัดสินในลักษณะเดียวกัน นี่คือการให้เหตุผลโดยการเปรียบเทียบ ดังนั้น การใช้หลักการตัดสิน ตามบรรทัดฐาน ในคดีกฎหมายทั่วไปจึงเกิดขึ้น และหลักการstare decisis (อ่านว่า สตาร์-เอ-เด-ไซ-ซัส) ก็ได้รับการยอมรับในศาลอังกฤษStare decisisในภาษาละตินหมายความว่า “ให้คำตัดสินคงอยู่”

คำตัดสินของศาลส่วนใหญ่ที่ไม่เกี่ยวข้องกับกฎหมาย (ที่เรียกว่าพระราชบัญญัติ) จะเกี่ยวข้องกับกฎหมาย 3 สาขา ได้แก่ กฎหมายทรัพย์สิน กฎหมายสัญญา หรือกฎหมายละเมิด กฎหมายทรัพย์สินเกี่ยวข้องกับสิทธิและหน้าที่ของผู้ที่สามารถเป็นเจ้าของที่ดิน (อสังหาริมทรัพย์) ได้อย่างถูกกฎหมาย วิธีการยืนยันและคุ้มครองกรรมสิทธิ์นั้นอย่างถูกกฎหมาย วิธีการซื้อขายทรัพย์สิน สิทธิของผู้เช่า และประเภทต่างๆ ของ “กรรมสิทธิ์” ในที่ดิน (เช่น กรรมสิทธิ์สมบูรณ์ กรรมสิทธิ์ตลอดชีพ สิทธิในอนาคต ภาระจำยอม หรือสิทธิทางผ่าน) กฎหมายสัญญาเกี่ยวข้องกับประเภทของคำมั่นสัญญาที่ศาลควรบังคับใช้ ตัวอย่างเช่น ศาลควรบังคับใช้สัญญาหรือไม่ในกรณีที่ฝ่ายใดฝ่ายหนึ่งมึนเมา อายุไม่ถึงเกณฑ์ หรือวิกลจริต? ศาลควรบังคับใช้สัญญาหรือไม่ในกรณีที่ฝ่ายใดฝ่ายหนึ่งดูเหมือนจะได้เปรียบอย่างไม่เป็นธรรม? สัญญาประเภทใดที่ต้องทำเป็นลายลักษณ์อักษรจึงจะบังคับใช้ได้โดยศาล? กฎหมายละเมิดเกี่ยวข้องกับคดีประเภทที่เกี่ยวข้องกับความเสียหายหรือการบาดเจ็บระหว่างโจทก์และจำเลยในกรณีที่ไม่มีสัญญาเกิดขึ้น ดังนั้น หากคุณถูกใส่ร้ายหรือคู่แข่งโกหกเกี่ยวกับผลิตภัณฑ์ของคุณ การเยียวยาของคุณจะเป็นไปตามกฎหมายละเมิด ไม่ใช่ตามสัญญา

อาณานิคมดั้งเดิมทั้งสิบสามแห่งใช้กฎหมายจารีตประเพณีของอังกฤษมาเป็นเวลานาน และพวกเขายังคงใช้ต่อไปหลังจากได้รับเอกราชจากอังกฤษ คดีความในยุคแรกๆ จากรัฐแรกๆ เต็มไปด้วยการอ้างอิงถึงคดีของอังกฤษที่ตัดสินไปแล้ว เมื่อเวลาผ่านไป ศาลของรัฐต่างๆ ในสหรัฐอเมริกาได้สร้างบรรทัดฐานทางกฎหมายขึ้นมากมาย ดังนั้นในปัจจุบัน คำวินิจฉัยของศาลที่อ้างอิงถึงคดีกฎหมายจารีตประเพณีของอังกฤษในศตวรรษที่สิบเจ็ดหรือสิบแปดจึงค่อนข้างหายาก

ศาลในรัฐหนึ่งอาจพิจารณาคำตัดสินตามกฎหมายจารีตประเพณีจากศาลในรัฐอื่น ๆ หากเหตุผลในคดีที่คล้ายคลึงกันนั้นมีน้ำหนักน่าเชื่อถือ กรณีนี้จะเกิดขึ้นใน “คดีที่ไม่เคยมีการพิจารณามาก่อน” ซึ่งหมายถึงข้อเท็จจริงหรือสถานการณ์ที่ศาลในรัฐนั้นไม่เคยพบเห็นมาก่อน แต่หากศาลฎีกาในรัฐใดรัฐหนึ่งได้ตัดสินคดีประเภทนั้นไปแล้ว ศาลชั้นล่างในรัฐนั้นจะปฏิบัติตามกฎที่ศาลสูงสุดกำหนดไว้เสมอ

ศาลของรัฐและขอบเขตของกฎหมายของรัฐ
ในยุคแรกเริ่มของประเทศ ศาลรัฐบาลกลางไม่ได้มีบทบาทหรือความสำคัญมากเท่ากับศาลของรัฐ รัฐต่างๆ มีอำนาจศาล (อำนาจในการออกและบังคับใช้กฎหมาย) ในด้านที่สำคัญที่สุดของชีวิตทางธุรกิจ อำนาจของกฎหมายรัฐในอดีตครอบคลุมถึงการควบคุมประเด็นและข้อเรียกร้องประเภทต่างๆ ดังต่อไปนี้:

สัญญาต่างๆ รวมถึงสัญญาซื้อขาย ตราสารหนี้ระยะสั้น หนังสือค้ำประกัน และธุรกรรมที่มีหลักประกัน
การละเมิด
ทรัพย์สิน ซึ่งรวมถึงอสังหาริมทรัพย์ การฝากทรัพย์สินส่วนบุคคล (เช่น การฝากเสื้อโค้ทไว้ที่โรงละคร หรือการฝากเสื้อผ้าไว้กับร้านซักแห้ง) เครื่องหมายการค้า ลิขสิทธิ์ และมรดกของผู้ตาย
บริษัทต่างๆ
ความร่วมมือ
เรื่องภายในครอบครัว รวมถึงการแต่งงาน การหย่าร้าง การดูแลบุตร การรับบุตรบุญธรรม และการเยี่ยมเยียนบุตร
กฎหมายหลักทรัพย์
กฎหมายสิ่งแวดล้อม
กฎหมายตัวแทน ว่าด้วยความสัมพันธ์ระหว่างผู้ว่าจ้างและตัวแทน
การธนาคาร
ประกันภัย
อย่างไรก็ตาม ในช่วงแปดสิบปีที่ผ่านมา กฎหมายของรัฐบาลกลางมีความสำคัญมากขึ้นเรื่อยๆ ในหลายด้านเหล่านี้ รวมถึงกฎหมายด้านการธนาคาร หลักทรัพย์ และสิ่งแวดล้อม

คดีแพ่งเทียบกับคดีอาญา
คดีส่วนใหญ่ที่เราจะพิจารณาในตำราเล่มนี้เป็นคดีแพ่ง คดีอาญาเป็นเรื่องที่น่าสนใจสำหรับภาคธุรกิจ โดยเฉพาะอย่างยิ่งในกรณีที่บริษัทต่างๆ อาจละเมิดกฎหมายอาญา คดีอาญาเกี่ยวข้องกับการตัดสินใจของรัฐบาล ไม่ว่าจะเป็นระดับรัฐหรือระดับสหรัฐฯ ในการดำเนินคดีกับบุคคลใดบุคคลหนึ่ง (ที่ถูกระบุว่าเป็นจำเลย) ในข้อหาละเมิดกฎหมายของสังคม กฎหมายกำหนดมาตรฐานทางศีลธรรมขั้นต่ำ โดยเฉพาะอย่างยิ่งในด้านกฎหมายอาญา หากคุณละเมิดกฎหมายอาญา คุณอาจสูญเสียอิสรภาพ (ในคุก) หรือชีวิต (หากคุณถูกตัดสินว่ามีความผิดในคดีที่มีโทษประหารชีวิต) ในคดีแพ่ง คุณจะไม่ถูกส่งเข้าคุก ในกรณีที่เลวร้ายที่สุด คุณอาจสูญเสียทรัพย์สิน (โดยปกติจะเป็นเงินหรือสินทรัพย์อื่นๆ) เช่นเดียวกับกรณีที่บริษัท Ford Motor Company แพ้คดีการบาดเจ็บส่วนบุคคลและผู้พิพากษาตัดสินให้โจทก์ได้รับเงินชดเชย 295 ล้านดอลลาร์ หรือกรณีที่ Pennzoil ชนะคดีและได้รับเงินชดเชย 10.54 พันล้านดอลลาร์จาก Texaco (ดูบทที่ 7 "บทนำเกี่ยวกับกฎหมายละเมิด" )

ตารางที่ 1.1 "ความแตกต่างระหว่างคดีแพ่งและคดีอาญา " แสดงความแตกต่างพื้นฐานบางประการ ระหว่างคดีแพ่งและคดีอาญา

ตารางที่ 1.1ความแตกต่างระหว่างคดีแพ่งและคดีอาญา

คดีแพ่ง	คดีอาญา
ฝ่ายต่างๆ	โจทก์ยื่นฟ้อง จำเลยต้องตอบข้อกล่าวหา มิฉะนั้นจะแพ้คดีโดยปริยาย	อัยการยื่นฟ้องจำเลยอาจเลือกที่จะไม่พูดอะไร
การพิสูจน์	หลักฐานส่วนใหญ่	เกินกว่าข้อสงสัยอันสมเหตุสมผล
เหตุผล	เพื่อยุติข้อพิพาทอย่างสันติ โดยปกติมักเกิดขึ้นระหว่างบุคคลทั่วไป	เพื่อรักษาความสงบเรียบร้อยในสังคม
เพื่อลงโทษผู้ที่กระทำผิดมากที่สุด
เพื่อป้องกันการกระทำผิดร้ายแรง
การเยียวยา	ค่าเสียหายทางการเงิน (การเยียวยาทางกฎหมาย)	ค่าปรับ จำคุก และริบของกลาง
คำสั่งห้าม (การเยียวยาทางกฎหมาย)	
ผลการดำเนินงานเฉพาะ (ส่วนของผู้ถือหุ้น)	
สำหรับโจทก์และอัยการ คุณมักจะสามารถแยกแยะคดีแพ่งออกจากคดีอาญาได้โดยดูจากชื่อคดีที่จะขึ้นศาล หากรัฐบาลปรากฏเป็นชื่อแรกในหัวข้อคดี (เช่นUS v. Lieberman ) แสดงว่าสหรัฐอเมริกากำลังดำเนินคดีในนามของประชาชน เช่นเดียวกับคดีที่ดำเนินคดีโดยอัยการเขตของรัฐ (เช่นState v. Seidel ) แต่สูตรนี้ก็ไม่ได้แน่นอนเสมอไป รัฐบาลยังสามารถดำเนินคดีแพ่งเพื่อเรียกเก็บหนี้หรือระงับข้อพิพาทกับบุคคล บริษัท หรือรัฐบาลอื่น ๆ ได้อีกด้วย ดังนั้นUS v. Mayerอาจเป็นการฟ้องร้องเรียกเก็บภาษีค้างชำระ หรือUS v. Canadaอาจเป็นข้อพิพาทเรื่องเขตแดนในศาลยุติธรรมระหว่างประเทศ รัฐบาลก็สามารถถูกฟ้องร้องได้เช่นกัน ประชาชนบางครั้งฟ้องร้องรัฐบาลของรัฐหรือรัฐบาลกลาง แต่จะได้รับการพิจารณาคดีก็ต่อเมื่อรัฐบาลสละสิทธิ์คุ้มครองทางอธิปไตยและอนุญาตให้มีการฟ้องร้องดังกล่าว ตัวอย่างเช่น Warner v. USอาจเป็นการเรียกร้องเงินคืนภาษีที่ถูกหักไว้โดยไม่ถูกต้อง หรือค่าเสียหายที่เกิดกับบ้านของ Warner จากเสียงดังสนั่นของเครื่องบินรบกองทัพอากาศสหรัฐฯ ที่บินอยู่เหนือศีรษะ

เนื้อหาเทียบกับขั้นตอน
กฎหมายและข้อบังคับหลายข้อเป็นกฎหมายสาระสำคัญ และบางข้อเป็นกฎหมายวิธีพิจารณาความ เราคุ้นเคยกับการมองกฎหมายในแง่ของสาระสำคัญ กล่าวคือ มีกฎเกณฑ์เกี่ยวกับการประพฤติหรือพฤติกรรมที่กำหนดไว้ หรือการกระทำบางอย่างที่ถูกห้าม (ไม่อนุญาต) กฎหมายสาระสำคัญบอกเราถึงวิธีการปฏิบัติต่อกันและต่อรัฐบาล ตัวอย่างเช่น กฎหมายต่อไปนี้ล้วนเป็นกฎหมายสาระสำคัญและให้คำสั่งหรือคำแนะนำแก่ประชาชน:

ขับรถไม่เกินห้าสิบห้าไมล์ต่อชั่วโมงในบริเวณที่มีป้ายจำกัดความเร็ว
ห้ามสมคบคิดกันกำหนดราคาเพื่อผูกขาดกับคู่แข่งในตลาดสหรัฐอเมริกา
อย่ากล่าวอ้างสรรพคุณการรักษาของยาสมุนไพรที่หาซื้อได้ทั่วไปอย่างไม่เป็นความจริง
ห้ามขับรถยนต์ผ่านสี่แยกขณะที่สัญญาณไฟจราจรเป็นสีแดงหันไปทางทิศที่คุณกำลังมาจาก
ห้ามเลือกปฏิบัติกับผู้สมัครงานหรือพนักงานบนพื้นฐานของเชื้อชาติ เพศ ศาสนา หรือแหล่งกำเนิด
ห้ามปล่อยสารมลพิษบางชนิดลงสู่แม่น้ำโดยไม่ได้รับใบอนุญาตปล่อยสารมลพิษก่อน
ในทางตรงกันข้าม กฎหมายวิธีพิจารณาความคือระเบียบของศาลและหน่วยงานบริหาร กฎเหล่านี้บอกเราถึงวิธีการดำเนินการหากมีปัญหาด้านกฎหมายเนื้อหา ตัวอย่างเช่น หากคุณขับรถด้วยความเร็ว 53 ไมล์ต่อชั่วโมงในเขตจำกัดความเร็ว 40 ไมล์ต่อชั่วโมงบนถนนเมนสตรีทในคืนวันเสาร์และได้รับใบสั่ง คุณได้ละเมิดกฎหมายเนื้อหา (การจำกัดความเร็วที่กำหนดไว้) วิธีการและสิ่งที่ศาลจะตัดสินนั้นเป็นเรื่องของกฎหมายวิธีพิจารณาความ คำตัดสินของเจ้าหน้าที่ตำรวจเป็นที่สิ้นสุดหรือไม่ หรือคุณมีสิทธิ์พูดต่อหน้าผู้พิพากษา? ถ้าเป็นเช่นนั้น ใครควรพูดก่อน คุณหรือเจ้าหน้าที่? คุณมีสิทธิ์ได้รับการว่าความจากทนายความหรือไม่? การพิจารณาคดีหรือการไต่สวนต้องเกิดขึ้นภายในระยะเวลาที่กำหนดหรือไม่? หนึ่งสัปดาห์? หนึ่งเดือน? รัฐสามารถใช้เวลานานเท่าใดในการนำเสนอคดี? หลักฐานประเภทใดที่จะเกี่ยวข้อง? เรดาร์? (การฝึกอบรมของเจ้าหน้าที่เกี่ยวกับการใช้เรดาร์มีความสำคัญหรือไม่? เรดาร์ได้รับการทดสอบอย่างเพียงพอหรือไม่?) การสังเกตส่วนตัวของเจ้าหน้าที่? (เขาได้รับการฝึกฝนมาอย่างไร เขามีคุณสมบัติอย่างไรในการประเมินความเร็วของรถยนต์ และยังมีคำถามอื่นๆ ตามมา) แล้วถ้าหากคุณโอ้อวดอย่างไม่รอบคอบกับเพื่อนในงานปาร์ตี้เมื่อเร็วๆ นี้ว่า คุณขับรถด้วยความเร็ว 100 ไมล์ต่อชั่วโมงบนถนนเมนสตรีทเมื่อ 5 ปีก่อน เวลา 3.30 น. ของเช้าวันอังคารล่ะ? (ถ้าอัยการรู้เรื่องนี้และ "เพื่อน" ยินดีที่จะเป็นพยาน เรื่องนี้เกี่ยวข้องกับข้อหาขับรถเร็ว 53 ไมล์ต่อชั่วโมงในเขตจำกัดความเร็ว 40 ไมล์ต่อชั่วโมงหรือไม่?)

ในสหรัฐอเมริกา กฎหมายวิธีพิจารณาความของรัฐทุกฉบับต้องมีความเป็นธรรม เนื่องจากบทบัญญัติว่าด้วยกระบวนการยุติธรรมตามรัฐธรรมนูญแก้ไขเพิ่มเติมฉบับที่ 14 กำหนดว่า รัฐใด ๆ จะต้องไม่ลิดรอน “ชีวิต เสรีภาพ หรือทรัพย์สิน” ของพลเมืองใด ๆ โดยปราศจากกระบวนการยุติธรรมตามกฎหมาย (ค่าปรับ 200 ดอลลาร์บวกค่าใช้จ่ายในศาลมีจุดประสงค์เพื่อลิดรอนทรัพย์สินของคุณ นั่นคือเงิน หากคุณฝ่าฝืนจำกัดความเร็ว) กฎหมายของรัฐบาลกลางก็ต้องมีความเป็นธรรมเช่นกัน เพราะรัฐธรรมนูญแก้ไขเพิ่มเติมฉบับที่ 5 มีถ้อยคำเกี่ยวกับกระบวนการยุติธรรมเช่นเดียวกับรัฐธรรมนูญแก้ไขเพิ่มเติมฉบับที่ 14 สิ่งนี้ชี้ให้เห็นว่ากฎหมายบางฉบับมีอำนาจหรือสำคัญกว่าฉบับอื่น ซึ่งเป็นความจริง ส่วนต่อไปจะกล่าวถึงกฎหมายประเภทต่าง ๆ และความสำคัญสัมพัทธ์ของกฎหมายเหล่านั้น

ประเด็นสำคัญ
ในระบบกฎหมายส่วนใหญ่ เช่นในสหรัฐอเมริกา มีการแบ่งแยกอย่างชัดเจนระหว่างกฎหมายอาญา (สำหรับการกระทำที่เป็นความผิดต่อสังคมโดยรวม) และกฎหมายแพ่ง (โดยปกติสำหรับข้อพิพาทระหว่างบุคคลหรือบริษัท) บรรทัดฐานทางจริยธรรมขั้นพื้นฐานเกี่ยวกับการรักษาสัญญาและการไม่ทำร้ายผู้อื่นสะท้อนอยู่ในกฎหมายแพ่งว่าด้วยสัญญาและการละเมิด ในสหรัฐอเมริกา ทั้งรัฐบาลของรัฐและรัฐบาลกลางมีบทบาท และบางครั้งบทบาทเหล่านี้อาจทับซ้อนกัน เช่น มาตรฐานด้านสิ่งแวดล้อมที่กำหนดโดยทั้งรัฐบาลของรัฐและรัฐบาลกลาง

แบบฝึกหัด
เจนน่าได้รับใบสั่งข้อหาขับรถโดยประมาท หลังจากตำรวจมาตรวจสอบอุบัติเหตุทางรถยนต์ที่เธอและคุณประสบบนถนนฮาโนเวอร์ บูเลอวาร์ด รถของคุณเสียหายอย่างหนักโดยที่คุณไม่ได้ทำผิดอะไรเลย เจนน่ามีโอกาสที่จะถูกดำเนินคดีอาญา คดีแพ่ง หรือทั้งสองอย่างหรือไม่?
ในใบสั่งของเจนนาระบุว่าเธอมีเวลาสามสิบวันในการตอบข้อกล่าวหา ซึ่งเป็นไปตามกฎหมายของรัฐที่กำหนดระยะเวลานี้ไว้ ระยะเวลาสามสิบวันนี้เป็นกฎหมายวิธีพิจารณาความหรือกฎหมายสาระสำคัญ?
1.4แหล่งที่มาของกฎหมายและลำดับความสำคัญ
วัตถุประสงค์การเรียนรู้
อธิบายแหล่งที่มาของกฎหมายต่างๆ ในระบบกฎหมายของสหรัฐอเมริกา และสถาบันหลักที่สร้างกฎหมายเหล่านั้น
อธิบายว่ากฎหมายมีลักษณะคล้ายคลึงกับสนธิสัญญาอย่างไร และในทางกลับกันอย่างไร
อธิบายว่าเหตุใดรัฐธรรมนูญจึงมี “ลำดับความสำคัญเหนือกว่า” และมีลำดับความสำคัญเหนือกว่ากฎหมายที่ออกโดยเสียงข้างมาก ไม่ว่าจะเป็นในรัฐสภาสหรัฐฯ หรือในสภานิติบัญญัติของรัฐ
อธิบายที่มาของระบบกฎหมายจารีตประเพณี และความหมายของกฎหมายจารีตประเพณี
แหล่งที่มาของกฎหมาย
ในสหรัฐอเมริกาในปัจจุบัน มีแหล่งที่มาของกฎหมายมากมาย แหล่งที่มาหลักๆ ได้แก่ (1) รัฐธรรมนูญ—ทั้งของรัฐและของรัฐบาลกลาง (2) กฎหมายและข้อบังคับของหน่วยงาน และ (3) คำตัดสินของศาล นอกจากนี้ หัวหน้าฝ่ายบริหาร (ประธานาธิบดีและผู้ว่าการรัฐต่างๆ) สามารถออกคำสั่งบริหารที่มีผลเช่นเดียวกับกฎหมายได้

ในระบบกฎหมายระหว่างประเทศ แหล่งที่มาของกฎหมายได้แก่สนธิสัญญา (ข้อตกลงระหว่างรัฐหรือประเทศต่างๆ) และสิ่งที่เรียกว่ากฎหมายจารีตประเพณีระหว่างประเทศ (โดยปกติประกอบด้วยคำตัดสินของศาลระดับชาติในกรณีที่คู่กรณีจากสองประเทศขึ้นไปมีข้อพิพาทกัน)

อย่างที่คุณอาจคาดเดาได้ กฎหมายเหล่านี้บางครั้งอาจขัดแย้งกัน: กฎหมายของรัฐอาจขัดแย้งกับกฎหมายของรัฐบาลกลาง หรือกฎหมายของรัฐบาลกลางอาจขัดกับพันธกรณีระหว่างประเทศ กฎหมายของประเทศหนึ่งอาจกำหนดกฎเกณฑ์สาระสำคัญอย่างหนึ่ง ในขณะที่กฎหมายของอีกประเทศหนึ่งอาจกำหนดกฎเกณฑ์ที่แตกต่างออกไปและขัดแย้งกันเล็กน้อย กล่าวอีกนัยหนึ่งคือ กฎหมายทุกฉบับไม่ได้มีความเท่าเทียมกัน เพื่อให้เข้าใจว่ากฎหมายใดมีลำดับความสำคัญเหนือกว่า จำเป็นอย่างยิ่งที่จะต้องเข้าใจความสัมพันธ์ระหว่างกฎหมายประเภทต่างๆ

รัฐธรรมนูญ
รัฐธรรมนูญเป็นรากฐานของกฎหมายอื่นๆ ของรัฐหรือประเทศ โดยให้กรอบการทำงานด้านนิติบัญญัติ บริหาร และตุลาการของประเทศ ในบรรดาประเทศต่างๆ ทั่วโลก สหรัฐอเมริกามีรัฐธรรมนูญที่เก่าแก่ที่สุดที่ยังคงใช้อยู่ในปัจจุบัน การแก้ไขรัฐธรรมนูญนั้นทำได้ยาก ซึ่งเป็นเหตุผลว่าทำไมจึงมีการแก้ไขเพิ่มเติมเพียงสิบเจ็ดครั้งหลังจากสิบครั้งแรกในปี 1789 การแก้ไขเพิ่มเติมต้องได้รับความเห็นชอบจากสองในสามของสภาผู้แทนราษฎรและวุฒิสภา และสามในสี่ของรัฐต่างๆ ต้องอนุมัติด้วย

รัฐต่างๆ ในประเทศก็มีรัฐธรรมนูญเช่นกัน นอกเหนือจากการกำหนดหน้าที่ด้านนิติบัญญัติ บริหาร และตุลาการแล้ว รัฐธรรมนูญของรัฐยังกำหนดสิทธิต่างๆ ของพลเมือง สิทธิเหล่านี้อาจแตกต่างจาก และเพิ่มเติมจากสิทธิที่ได้รับจากรัฐธรรมนูญของสหรัฐอเมริกา เช่นเดียวกับกฎหมายและคำพิพากษา รัฐธรรมนูญมีบทบัญญัติเฉพาะที่สามารถให้ “สิทธิในการฟ้องร้อง” แก่ประชาชนได้ (ดูหัวข้อ 1.4.3 “สิทธิในการฟ้องร้อง คำพิพากษาที่เป็นบรรทัดฐาน และ “สิทธิในการฟ้องร้อง”) ตัวอย่างเช่น รัฐธรรมนูญของรัฐแคลิฟอร์เนียบัญญัติว่าพลเมืองของรัฐนั้นมีสิทธิในความเป็นส่วนตัว ซึ่งถูกนำมาใช้เพื่อเรียกร้องค่าเสียหายจากธุรกิจที่ละเมิดสิทธิความเป็นส่วนตัวของพนักงาน ในกรณีของเวอร์จิเนีย รูลอน-มิลเลอร์ นายจ้างของเธอ บริษัท อินเตอร์เนชั่นแนล บิสซิเนส แมชชีนส์ (IBM) บอกให้เธอหยุดคบกับอดีตเพื่อนร่วมงานที่ไปทำงานกับคู่แข่ง เมื่อเธอปฏิเสธ IBM จึงเลิกจ้างเธอ และคณะลูกขุนได้ปรับบริษัทเป็นเงิน 300,000 ดอลลาร์สหรัฐในข้อหาความเสียหาย ดังที่ศาลแคลิฟอร์เนียได้กล่าวไว้ว่า “แม้ว่าพนักงานจะเสียสละสิทธิความเป็นส่วนตัวบางประการเมื่อเข้าสู่สถานที่ทำงาน แต่ความคาดหวังด้านความเป็นส่วนตัวของพนักงานจะต้องสมดุลกับผลประโยชน์ของนายจ้าง…ประเด็นสำคัญคือความเป็นส่วนตัว เช่นเดียวกับสิทธิที่ไม่อาจโอนได้อื่นๆ ที่ระบุไว้เป็นอันดับแรกในรัฐธรรมนูญของเรา…เป็นผลประโยชน์พื้นฐานของสังคมเราอย่างไม่ต้องสงสัย” Rulon-Miller v. International Business Machines Corp. , 162 Cal. App.3d 241, 255 (1984).

กฎหมายและสนธิสัญญาในรัฐสภา
ในกรุงวอชิงตัน ดี.ซี. สภานิติบัญญัติของรัฐบาลกลางเรียกว่ารัฐสภา ซึ่งประกอบด้วยสภาผู้แทนราษฎรและวุฒิสภา สภาผู้แทนราษฎรประกอบด้วยผู้แทนที่ได้รับการเลือกตั้งทุกสองปีจากเขตเลือกตั้งต่างๆ ในแต่ละรัฐ เขตเลือกตั้งเหล่านี้จัดตั้งขึ้นโดยรัฐสภาตามจำนวนประชากรที่กำหนดทุกสิบปีโดยการสำรวจสำมะโนประชากร ซึ่งเป็นกระบวนการที่รัฐธรรมนูญกำหนดไว้ แต่ละรัฐมีอย่างน้อยหนึ่งเขตเลือกตั้ง รัฐที่มีประชากรมากที่สุด (แคลิฟอร์เนีย) มีห้าสิบสองเขตเลือกตั้ง ในวุฒิสภา มีวุฒิสมาชิกสองคนจากแต่ละรัฐ โดยไม่คำนึงถึงจำนวนประชากรของรัฐนั้น ดังนั้นเดลาแวร์จึงมีวุฒิสมาชิกสองคนและแคลิฟอร์เนียก็มีวุฒิสมาชิกสองคน แม้ว่าแคลิฟอร์เนียจะมีประชากรมากกว่ามากก็ตาม กล่าวคือ ประชากรน้อยกว่า 20 เปอร์เซ็นต์ของประเทศสามารถส่งวุฒิสมาชิกห้าสิบคนไปยังวอชิงตันได้

หลายคนมองว่านี่เป็นการกระทำที่ต่อต้านประชาธิปไตย ในทางกลับกัน สภาผู้แทนราษฎรมีสัดส่วนโดยตรงตามจำนวนประชากร แม้ว่าแต่ละรัฐจะมีผู้แทนได้ไม่น้อยกว่าหนึ่งคนก็ตาม

แต่ละสภาของรัฐสภามีคณะกรรมการเพื่อวัตถุประสงค์ต่างๆ ในคณะกรรมการเหล่านี้ จะมีการอภิปรายร่างกฎหมาย บางครั้งอาจมีการจัดประชุมรับฟังความคิดเห็น และร่างกฎหมายนั้นอาจถูกนำเสนอต่อที่ประชุม (นำเสนอต่อที่ประชุมเพื่อลงคะแนน) หรือถูกปัดตกในคณะกรรมการ หากร่างกฎหมายถูกนำเสนอต่อที่ประชุมแล้ว อาจได้รับการอนุมัติด้วยคะแนนเสียงข้างมาก เนื่องจากความแตกต่างทางด้านขั้นตอนระหว่างสภาผู้แทนราษฎรและวุฒิสภา ร่างกฎหมายที่มีถ้อยคำเหมือนกันเมื่อเสนอในทั้งสองสภา มักจะแตกต่างกันหลังจากได้รับการอนุมัติจากแต่ละสภาแล้ว จึงจะมีการจัดตั้งคณะกรรมการร่วมเพื่อพยายามทำให้ร่างกฎหมายทั้งสองฉบับมีความสอดคล้องกัน หากร่างกฎหมายทั้งสองฉบับแตกต่างกันมากพอ การประนีประนอมร่างกฎหมายที่แตกต่างกันสองฉบับให้เป็นที่ยอมรับของทั้งสองสภา (สภาผู้แทนราษฎรและวุฒิสภา) ก็จะทำได้ยากขึ้น

หากสภาผู้แทนราษฎรและวุฒิสภาสามารถตกลงกันในถ้อยคำที่เหมือนกันได้ ร่างกฎหมายที่ประนีประนอมแล้วจะถูกส่งไปยังประธานาธิบดีเพื่อลงนามหรือใช้สิทธิ์ยับยั้ง รัฐธรรมนูญบัญญัติว่าประธานาธิบดีมีอำนาจยับยั้งกฎหมายใดๆ แต่ทั้งสองสภาสามารถล้มล้างการยับยั้งของประธานาธิบดีได้ด้วยคะแนนเสียงสองในสามของแต่ละสภา

ในกรณีของสนธิสัญญา รัฐธรรมนูญระบุว่าเฉพาะวุฒิสภาเท่านั้นที่จะต้องให้สัตยาบัน เมื่อวุฒิสภาให้สัตยาบันสนธิสัญญาแล้ว สนธิสัญญานั้นจะกลายเป็นส่วนหนึ่งของกฎหมายของรัฐบาลกลาง โดยมีน้ำหนักและผลบังคับใช้เช่นเดียวกับกฎหมายที่ผ่านโดยรัฐสภาทั้งหมด กฎหมายของรัฐสภาถูกรวบรวมไว้ในรูปแบบประมวลกฎหมายของสหรัฐอเมริกา ซึ่งสามารถดูได้ทางออนไลน์ที่http://uscode.house.gov

การมอบอำนาจทางนิติบัญญัติ: กฎระเบียบโดยหน่วยงานบริหาร
รัฐสภาเห็นว่าจำเป็นและเป็นประโยชน์ที่จะจัดตั้งหน่วยงานของรัฐบาลเพื่อบริหารจัดการกฎหมายต่างๆ (ดูบทที่ 5 "กฎหมายปกครอง" ) รัฐธรรมนูญไม่ได้บัญญัติถึงหน่วยงานบริหารโดยชัดแจ้ง แต่ศาลฎีกาสหรัฐฯ ได้รับรองการมอบอำนาจในการจัดตั้งหน่วยงานของรัฐบาลกลาง

ตัวอย่างของหน่วยงานบริหาร ได้แก่ สำนักงานความปลอดภัยและสุขภาพในการทำงาน (OSHA) สำนักงานคุ้มครองสิ่งแวดล้อม (EPA) และคณะกรรมการการค้าแห่งสหรัฐอเมริกา (FTC)

สิ่งสำคัญที่ควรทราบคือ รัฐสภาไม่ได้มีอำนาจไม่จำกัดในการมอบอำนาจการออกกฎหมายให้แก่หน่วยงานใดๆ รัฐสภาต้องมอบอำนาจโดยมีแนวทางบางประการสำหรับหน่วยงานนั้นๆ และไม่สามารถหลีกเลี่ยงความรับผิดชอบตามรัฐธรรมนูญได้อย่างสิ้นเชิง (ดูบทที่ 5 "กฎหมายปกครอง" )

หน่วยงานต่างๆ เสนอข้อกำหนดในวารสาร Federal Register ซึ่งตีพิมพ์ทุกวันทำการตลอดทั้งปี ข้อกำหนดที่ได้รับการอนุมัติอย่างเป็นทางการจะถูกตีพิมพ์ในประมวลกฎหมายของรัฐบาลกลางหรือ CFR ซึ่งสามารถดูได้ทางออนไลน์ที่http://www.access.gpo.gov/nara/cfr/cfr-table-search.html

กฎหมายและหน่วยงานของรัฐ: กฎหมายอื่นๆ ที่บัญญัติไว้
กฎหมายถูกตราขึ้นโดยสภานิติบัญญัติและกำหนดกฎเกณฑ์ทั่วไปสำหรับสังคม รัฐต่างๆ มีสภานิติบัญญัติ (บางครั้งเรียกว่าสภา) ซึ่งโดยปกติประกอบด้วยวุฒิสภาและสภาผู้แทนราษฎร เช่นเดียวกับรัฐบาลกลาง สภานิติบัญญัติของรัฐจะตกลงกันในข้อกำหนดของร่างกฎหมาย จากนั้นจะส่งไปยังผู้ว่าการรัฐ (ทำหน้าที่เสมือนประธานาธิบดีของรัฐนั้น) เพื่อลงนาม เช่นเดียวกับประธานาธิบดี ผู้ว่าการรัฐมักมีอำนาจยับยั้ง กระบวนการสร้าง แก้ไข หรือเปลี่ยนแปลงกฎหมายนั้นเต็มไปด้วยการเจรจาต่อรองและการประนีประนอมทางการเมือง

ในระดับท้องถิ่นมากขึ้น มณฑลและเทศบาลหรือตำบลอาจได้รับอนุญาตภายใต้รัฐธรรมนูญของรัฐให้สร้างหรือออกกฎหมายท้องถิ่น ตัวอย่างของกฎหมายท้องถิ่น ได้แก่ กฎหมายเกี่ยวกับการก่อสร้างในท้องถิ่น กฎหมายเกี่ยวกับการแบ่งเขต และความผิดเล็กน้อยหรือการละเมิด เช่น การเล่นสเก็ตบอร์ดหรือการข้ามถนนอย่างไม่ระมัดระวัง กฎหมายแปลกๆ ที่ปรากฏในข่าวเป็นครั้งคราวส่วนใหญ่เป็นกฎหมายท้องถิ่น ตัวอย่างเช่น ในมณฑลโลแกน รัฐโคโลราโด การจูบผู้หญิงที่กำลังนอนหลับเป็นสิ่งผิดกฎหมาย ในอินเดียนาโพลิส รัฐอินเดียนา และยูเรกา รัฐเนแบรสกา การจูบหากคุณมีหนวดเป็นอาชญากรรม แต่มีรายงานว่าบางรัฐยังคงมีกฎหมายแปลกๆ อยู่บ้าง กฎหมายของรัฐเคนตักกี้ประกาศว่าทุกคนในรัฐต้องอาบน้ำอย่างน้อยปีละครั้ง และการไม่ทำเช่นนั้นเป็นสิ่งผิดกฎหมาย

คำตัดสินของศาล: กฎหมายจารีตประเพณี
กฎหมายจารีตประเพณีประกอบด้วยคำตัดสินของศาล (คำตัดสินทางตุลาการ) ที่ไม่เกี่ยวข้องกับการตีความกฎหมาย ข้อบังคับ สนธิสัญญา หรือรัฐธรรมนูญ ศาลทำการตีความดังกล่าว แต่หลายคดีได้รับการตัดสินโดยที่ไม่มีกฎหมายหรือข้อบังคับใด ๆ ที่บัญญัติไว้เป็นลายลักษณ์อักษรให้ตีความ ตัวอย่างเช่น ศาลของรัฐที่ตัดสินว่าพยานประเภทใดจำเป็นสำหรับพินัยกรรมที่ถูกต้องในกรณีที่ไม่มีกฎ (จากกฎหมาย) บัญญัติไว้ ก็ถือเป็นกฎหมายจารีตประเพณี

กฎหมายของสหรัฐอเมริกามาจากประเพณีกฎหมายจารีตประเพณีของอังกฤษเป็นหลัก เมื่อถึงเวลาที่อาณานิคมอเมริกันของอังกฤษก่อการปฏิวัติในปี 1776 ประเพณีกฎหมายจารีตประเพณีของอังกฤษได้หยั่งรากอย่างมั่นคงในศาลของอาณานิคมแล้ว กฎหมายจารีตประเพณีของอังกฤษเป็นระบบที่ให้คำตัดสินของศาลที่เป็นลายลักษณ์อักษรมีผลบังคับใช้เป็นกฎหมายทั่วประเทศ ดังนั้น หากศาลอังกฤษมีคำวินิจฉัยว่าอะไรคือความผิดฐานลักทรัพย์ตามกฎหมายจารีตประเพณี ศาลอื่นๆ ก็จะยึดถือคำตัดสินนั้น ทำให้เกิดเป็นกฎหมายที่เป็นที่ยอมรับร่วมกันทั่วประเทศ กฎหมายจารีตประเพณีโดยพื้นฐานแล้วเป็นคำย่อสำหรับแนวคิดที่ว่า กฎหมายที่เป็นที่ยอมรับร่วมกันซึ่งอิงจากคำตัดสินที่เป็นลายลักษณ์อักษรในอดีตนั้นเป็นสิ่งที่พึงปรารถนาและจำเป็น

ในประเทศอังกฤษและในกฎหมายของรัฐทั้งสิบสามรัฐดั้งเดิม คำตัดสินตามกฎหมายจารีตประเพณีได้กำหนดความผิดทางอาญา เช่น การวางเพลิง การบุกรุก การฆาตกรรม และการปล้นทรัพย์ เมื่อเวลาผ่านไป สภานิติบัญญัติของรัฐต่างๆ ในสหรัฐอเมริกาได้นำเอาคำจำกัดความของความผิดทางอาญาตามกฎหมายจารีตประเพณีส่วนใหญ่มาใช้หรือแก้ไข โดยบัญญัติเป็นกฎหมายหรือประมวลกฎหมาย ความสามารถของฝ่ายนิติบัญญัติในการแก้ไขหรือเปลี่ยนแปลงกฎหมายจารีตประเพณีให้เป็นกฎหมายที่ศาลตัดสินนั้น ชี้ให้เห็นถึงปรากฏการณ์ที่สำคัญอย่างหนึ่ง นั่นคือ ลำดับความสำคัญของกฎหมายที่บัญญัติขึ้นเหนือกฎหมายจารีตประเพณี ดังที่เราจะเห็นในส่วนต่อไป กฎหมายรัฐธรรมนูญจะมีลำดับความสำคัญเหนือกว่ากฎหมายที่บัญญัติขึ้น

ลำดับความสำคัญของกฎหมาย
รัฐธรรมนูญในฐานะที่เป็นมาตรการป้องกันล่วงหน้าในกฎหมายของสหรัฐอเมริกา
รัฐธรรมนูญของสหรัฐอเมริกามีอำนาจเหนือกว่ากฎหมายและคำตัดสินของศาลทั้งหมดที่ขัดแย้งกัน ตัวอย่างเช่น หากรัฐมิชิแกนออกกฎหมายห้ามนักศึกษาพูดจาไม่ดีเกี่ยวกับอาจารย์ในมหาวิทยาลัยของรัฐ กฎหมายนั้นจะเป็นโมฆะ เนื่องจากขัดแย้งกับพันธกรณีของรัฐภายใต้บทแก้ไขเพิ่มเติมฉบับที่ 1 ในการปกป้องเสรีภาพในการพูด หรือหากศาลของรัฐมิชิแกนอนุญาตให้อาจารย์ฟ้องร้องนักศึกษาที่พูดจาดูหมิ่นอาจารย์แต่ไม่ถึงขั้นหมิ่นประมาท ระบบยุติธรรมของรัฐก็จะไม่ปฏิบัติตามบทแก้ไขเพิ่มเติมฉบับที่ 1 (ดังที่เราจะเห็นในบทที่ 7 "บทนำเกี่ยวกับกฎหมายละเมิด"เสรีภาพในการพูดมีข้อจำกัด การหมิ่นประมาทเป็นสาเหตุของการฟ้องร้องในขณะที่บทแก้ไขเพิ่มเติมฉบับที่ 1 ถูกเพิ่มเข้าไปในรัฐธรรมนูญ และเป็นที่เข้าใจกันว่าสิทธิเสรีภาพในการพูดในบทแก้ไขเพิ่มเติมฉบับที่ 1 ไม่ได้ลบล้างกฎหมายจารีตประเพณีที่มีอยู่เดิม)

กฎหมายและคำพิพากษา
โดยทั่วไปแล้ว กฎหมายจะมีลำดับความสำคัญเหนือกว่ากฎหมายที่เกิดจากการตัดสินของศาล (คำพิพากษาของศาล) ภายใต้กฎหมายจารีตประเพณี นายจ้างสามารถจ้างเด็กเล็กทำงานหนัก เสนอค่าจ้างเท่าใดก็ได้ และไม่ต้องจ่ายค่าล่วงเวลาในอัตราที่สูงกว่า แต่กฎหมายต่างๆ ได้เปลี่ยนแปลงเรื่องนี้ไปแล้ว ตัวอย่างเช่น พระราชบัญญัติมาตรฐานแรงงานที่เป็นธรรมของรัฐบาลกลาง (ค.ศ. 1938) ห้ามการใช้แรงงานเด็กอย่างไม่เป็นธรรม และกำหนดค่าจ้างขั้นต่ำและกฎเกณฑ์การจ่ายค่าล่วงเวลา

สนธิสัญญาเสมือนกฎหมาย: หลักการ “กฎหมายฉบับสุดท้าย”
สนธิสัญญาหรืออนุสัญญามีสถานะเท่าเทียมกับกฎหมาย ดังนั้น เมื่อรัฐสภาให้สัตยาบันข้อตกลงการค้าเสรีอเมริกาเหนือ (NAFTA) คำตัดสินของศาลหรือกฎหมายก่อนหน้านี้ที่ไม่สอดคล้องกัน เช่น โควตาหรือข้อจำกัดในการนำเข้าจากเม็กซิโกที่ขัดแย้งกับพันธกรณีของ NAFTA จะไม่มีผลบังคับใช้อีกต่อไป ในทำนองเดียวกัน พันธกรณีตามสนธิสัญญาของสหรัฐฯ ภายใต้ข้อตกลงทั่วไปว่าด้วยภาษีศุลกากรและการค้า (GATT) และพันธกรณีที่เกิดขึ้นภายหลังผ่านองค์การการค้าโลก (WTO) จะมีผลเหนือกว่ากฎหมายของรัฐบาลกลางหรือรัฐบาลของรัฐก่อนหน้านี้

ตัวอย่างหนึ่งของการที่พันธกรณีตามสนธิสัญญามีอำนาจเหนือกว่า หรือมีลำดับความสำคัญเหนือกว่ากฎหมายของรัฐบาลกลาง คือ ข้อพิพาทเรื่องปลาทูน่าและโลมา ระหว่างสหรัฐอเมริกาและเม็กซิโก การแก้ไขเพิ่มเติมพระราชบัญญัติคุ้มครองสัตว์เลี้ยงลูกด้วยนมในทะเลในปี 1988 ได้ระบุถึงการคุ้มครองโลมาในมหาสมุทรแปซิฟิกเขตร้อนตะวันออกไว้อย่างชัดเจน และสหรัฐอเมริกาเริ่มปฏิเสธที่จะอนุญาตให้นำเข้าปลาทูน่าที่จับได้ด้วยวิธีการที่ “ไม่เป็นมิตรต่อโลมา” (เช่น การจับด้วยอวนล้อม) เรื่องนี้ถูกท้าทายในคณะอนุญาโตตุลาการของ GATT ในสวิตเซอร์แลนด์ และสหรัฐอเมริกาแพ้คดี การอภิปรายยังคงดำเนินต่อไปที่ WTO ภายใต้กระบวนการระงับข้อพิพาทขององค์กร กล่าวโดยสรุป กฎหมายด้านสิ่งแวดล้อมของสหรัฐอเมริกาอาจถูกตัดสินว่าขัดต่อพันธกรณีตามสนธิสัญญาของสหรัฐอเมริกา

ภายใต้สนธิสัญญาส่วนใหญ่ สหรัฐอเมริกาสามารถถอนตัวหรือยกเลิกข้อจำกัดใดๆ ที่มีต่ออำนาจอธิปไตยของตนได้ การเข้าร่วมในสนธิสัญญาเป็นไปตามความสมัครใจโดยสิ้นเชิง กล่าวคือ สหรัฐอเมริกาสามารถ “ยกเลิกข้อผูกมัด” ของตนเองได้ทุกเมื่อที่ต้องการ แต่ในทางปฏิบัติแล้ว ข้อจำกัดบางประการเกี่ยวกับอำนาจอธิปไตยอาจเป็นประโยชน์ต่อประเทศได้ เหตุผลก็คือ หากการค้าเสรีโดยทั่วไปเป็นประโยชน์ต่อสหรัฐอเมริกา การเป็นส่วนหนึ่งของระบบที่ส่งเสริมการค้าเสรีก็ย่อมสมเหตุสมผล และถึงแม้จะมีอุปสรรคชั่วคราวบ้าง กระบวนการตัดสินใจขององค์การการค้าโลก (WTO) ก็หวังว่าจะให้ประโยชน์มากกว่าความสูญเสียในระยะยาว เหตุผลนี้อ้างอิงทฤษฎีอรรถประโยชน์นิยม (ที่ว่านโยบายที่ดีที่สุดจะก่อให้เกิดประโยชน์สูงสุดโดยรวมต่อสังคม) และทฤษฎีความได้เปรียบเชิงเปรียบเทียบของเดวิด ริคาร์โด

ท้ายที่สุดแล้ว การที่สหรัฐอเมริกาจะยังคงสนับสนุนการค้าเสรีและมีบทบาทเป็นผู้นำในองค์การการค้าโลกต่อไปหรือไม่นั้น ขึ้นอยู่กับการที่ประชาชนเลือกผู้นำที่สนับสนุนกระบวนการนี้ ตัวอย่างเช่น หากรอสส์ เพโรต์ได้รับเลือกตั้งในปี 1992 ข้อตกลงการค้าเสรีอเมริกาเหนือ-ใต้ (NAFTA) ก็จะสิ้นสุดลงทางการเมือง (และทางกฎหมาย) ในช่วงที่เขาดำรงตำแหน่ง

สาเหตุของการฟ้องร้อง, แนวทางปฏิบัติ และหลักการยึดถือคำพิพากษาเดิม
ไม่ว่าการกระทำของใครบางคนจะดูผิดมากแค่ไหนในสายตาคุณ ความผิดที่คุณสามารถแก้ไขได้ในศาลนั้นมีเฉพาะความผิดที่สามารถเชื่อมโยงกับสาเหตุของการฟ้องร้อง อย่างน้อยหนึ่ง ข้อเท่านั้น กฎหมายลายลักษณ์อักษรเต็มไปด้วยคดี สนธิสัญญา กฎหมาย ข้อบังคับ และบทบัญญัติในรัฐธรรมนูญที่สามารถนำมาใช้เป็นสาเหตุของการฟ้องร้องได้ หากคุณมีข้อตกลงกับแฮโรลด์ ฮิลล์ว่าเขาจะซื้อทรอมโบนเจ็ดสิบหกตัวจากคุณ และเขาไม่จ่ายเงินหลังจากที่คุณส่งมอบสินค้า คุณอาจรู้สึกว่าถูกกระทำไม่เป็นธรรม แต่ศาลจะพิจารณาคำร้องของคุณในทางที่เป็นประโยชน์ก็ต่อเมื่อคุณสามารถแสดงให้เห็นว่าพฤติกรรมของเขาก่อให้เกิดสาเหตุของการฟ้องร้องแก่คุณโดยอิงจากส่วนใดส่วนหนึ่งของกฎหมายสัญญาของรัฐของคุณ กรณีนี้จะทำให้คุณมีสาเหตุของการฟ้องร้องภายใต้กฎหมายของรัฐส่วนใหญ่ เว้นแต่ว่าแฮโรลด์ ฮิลล์จะมีข้อแก้ตัวทางกฎหมายที่ได้รับการยอมรับตามกฎหมายสัญญาของรัฐที่เกี่ยวข้อง เช่น การที่เขาไม่มีความสามารถทางกฎหมาย การที่เขามีอายุต่ำกว่าสิบแปดปี การที่เขาเมาสุราในขณะที่ทำข้อตกลง หรือการที่เขาอ้างว่าเครื่องดนตรีนั้นเป็นทรัมเป็ตแทนที่จะเป็นทรอมโบน หรือว่าเครื่องดนตรีนั้นถูกส่งมอบช้าเกินไปจนไม่สามารถใช้งานได้ คุณก็อาจคาดหวังที่จะเรียกร้องค่าชดเชยสำหรับการละเมิดข้อตกลงของคุณกับเขาได้

มีคำกล่าวเก่าแก่ในวงการกฎหมายว่า กฎหมายไม่ยุ่งเกี่ยวกับเรื่องเล็กน้อยหรือเรื่องที่ไม่สำคัญ (ในภาษาละตินde minimis non curat lex ) ไม่ใช่ทุกความผิดที่คุณอาจประสบในชีวิตจะเป็นเหตุให้ฟ้องร้องต่อศาลได้ หากคุณถูกนัดเดทในคืนวันเสาร์แล้วถูกทิ้งให้รอเก้อ และรู้สึกอับอายหรือเสียใจ คุณไม่สามารถเรียกร้องค่าเสียหายใดๆ ในศาลของสหรัฐอเมริกาได้ เนื่องจากไม่มีเหตุแห่งการฟ้องร้อง (ไม่มีพื้นฐานในกฎหมาย) ที่คุณสามารถใช้ในการร้องเรียนได้ หากคุณหมั้นหมายและว่าที่คู่สมรสของคุณหนีไปจากพิธีแต่งงาน มีบางรัฐที่ให้พื้นฐานทางกฎหมายในการฟ้องร้องได้ “การผิดสัญญาว่าจะแต่งงาน” ได้รับการยอมรับในหลายรัฐ แต่ส่วนใหญ่ได้ยกเลิกเหตุแห่งการฟ้องร้องนี้ไปแล้ว ไม่ว่าจะโดยคำตัดสินของศาลหรือโดยกฎหมาย การที่เจ้าสาวหรือเจ้าบ่าวหนีไปจะก่อให้เกิดเหตุแห่งการฟ้องร้องที่ถูกต้องในศาลหรือไม่นั้น ขึ้นอยู่กับว่าศาลของรัฐนั้นยังคงยอมรับและบังคับใช้เหตุแห่งการฟ้องร้องที่กำลังจะหายไปนี้หรือไม่

ดังนั้น ข้อกล่าวหาของคุณจึงอิงตามกฎหมายที่มีอยู่ รวมถึงคำพิพากษาที่ผ่านมาแล้ว ความสอดคล้องของคดีของคุณกับคำพิพากษาที่ผ่านมานั้น ก่อให้เกิดคำถามเกี่ยวกับบรรทัดฐานทางกฎหมาย

ดังที่ได้กล่าวไว้ก่อนหน้านี้ในบทนี้ ระบบกฎหมายจารีตประเพณีของอังกฤษให้ความสำคัญอย่างยิ่งต่อแบบอย่างและสิ่งที่เรียกว่าstare decisisศาลที่พิจารณาคดีหนึ่งๆ จะรู้สึกว่าตนเองมีหน้าที่ต้องตัดสินคดีนั้นในลักษณะที่คล้ายคลึงกับคดีที่เคยตัดสินไปแล้ว คำตัดสินที่เป็นลายลักษณ์อักษรของคดีสำคัญๆ ได้ถูกเผยแพร่ไปทั่วอังกฤษ (อาณาจักรทั่วไป) และผู้พิพากษาหวังที่จะสร้างกลุ่มคำตัดสินที่คาดเดาได้และสอดคล้องกันในระดับหนึ่ง

สภานิติบัญญัติของอังกฤษ (รัฐสภา) ไม่ได้มีธรรมเนียมปฏิบัติในการออกกฎหมายโดยละเอียดเกี่ยวกับอาชญากรรม การละเมิด สัญญา หรือทรัพย์สิน ดังนั้น คำจำกัดความและกฎเกณฑ์ต่างๆ จึงตกอยู่กับศาลเป็นหลัก โดยธรรมชาติแล้ว ศาลสามารถตัดสินคดีได้ครั้งละหนึ่งคดีเท่านั้น แต่ในการตัดสินนั้น ศาลจะกำหนดคำวินิจฉัยหรือกฎเกณฑ์ทั่วไปที่จะนำไปใช้กับคดีต่อๆ ไปได้

สมมติว่าศาลแห่งหนึ่งต้องตัดสินว่านายจ้างสามารถไล่ลูกจ้างออกโดยไม่มีเหตุผลได้หรือไม่ สมมติว่าไม่มีกฎหมายใดที่ใช้บังคับกับข้อเท็จจริงนี้ กล่าวคือ ไม่มีสัญญาจ้างงานระหว่างนายจ้างและลูกจ้าง แต่ลูกจ้างทำงานให้กับนายจ้างมาหลายปี และตอนนี้มีคนอายุน้อยกว่ามาทำงานแทนที่เขา ศาลซึ่งไม่มีแนวทางปฏิบัติในอดีต จะต้องตัดสินว่าลูกจ้างได้ยื่นฟ้อง “เหตุแห่งการฟ้องร้อง” ต่อนายจ้างหรือไม่ หากศาลตัดสินว่าคดีนี้ไม่สามารถฟ้องร้องได้ตามกฎหมาย ศาลก็จะยกฟ้องคดีนั้น ศาลในอนาคตก็จะปฏิบัติต่อคดีที่คล้ายคลึงกันในลักษณะเดียวกัน ในกระบวนการนี้ ศาลอาจตัดสินว่านายจ้างสามารถไล่ลูกจ้างออกได้ด้วยเหตุผลใดๆ ก็ได้ หรือไม่มีเหตุผลเลยก็ได้ กฎนี้อาจนำมาใช้ในอนาคตหากมีคดีที่คล้ายคลึงกันเกิดขึ้นอีก

แต่สมมติว่านายจ้างไล่ลูกจ้างออกเพราะลูกจ้างไม่ยอมให้การเท็จ (โกหกในศาล) โดยนายจ้างต้องการให้ลูกจ้างปกปิดการกระทำที่ผิดกฎหมายหรือผิดจรรยาบรรณของบริษัท สมมติว่าเช่นเดียวกับกรณีที่ผ่านมา ไม่มีกฎหมายที่เกี่ยวข้องและไม่มีสัญญาจ้างงาน ศาลอาจอาศัยคำพิพากษาหรือบรรทัดฐานที่ว่า “นายจ้างสามารถไล่ลูกจ้างออกได้ด้วยเหตุผลใดๆ หรือไม่มีเหตุผลก็ได้” และตัดสินให้ลูกจ้างที่เรียกร้องค่าชดเชยจากการถูกไล่ออกเพราะพูดความจริงในศาลแพ้คดี หรืออาจมีข้อยกเว้นจากกฎทั่วไป เช่น “โดยทั่วไปแล้วนายจ้างสามารถไล่ลูกจ้างออกได้ด้วยเหตุผลใดๆ หรือไม่มีเหตุผลก็ได้โดยไม่ต้องรับผิดทางกฎหมาย อย่างไรก็ตาม นายจ้างจะต้องรับผิดทางกฎหมายหากไล่ลูกจ้างที่ปฏิเสธที่จะโกหกเพื่อประโยชน์ของนายจ้างในศาล”

ในแต่ละกรณี (ทั้งกฎทั่วไปและข้อยกเว้น) ประเพณีกฎหมายจารีตประเพณีเรียกร้องให้ศาลอธิบายเหตุผลประกอบคำตัดสิน ในกรณีของกฎทั่วไป “เสรีภาพในการเลือก” อาจเป็นเหตุผลหลัก ในกรณีของข้อยกเว้นเรื่องการให้การเท็จ ประสิทธิภาพของระบบยุติธรรมและข้อกำหนดของความเป็นพลเมืองอาจถูกนำมาใช้เป็นเหตุผล เนื่องจาก “เหตุผล” ของศาลอาจโน้มน้าวใจบางคนและไม่โน้มน้าวใจคนอื่น จึงหลีกเลี่ยงไม่ได้ที่จะมีความเป็นอัตวิสัยอยู่ในความคิดเห็นของศาล กล่าวคือ คนที่มีเหตุผลจะมีความเห็นไม่ตรงกันเกี่ยวกับความน่าเชื่อถือของเหตุผลที่ศาลอาจนำเสนอเพื่อประกอบคำตัดสิน

ดังนั้น คำพิพากษาที่เป็นลายลักษณ์อักษรจึงเป็นสนามฝึกฝนที่ดีในการพัฒนาทักษะการคิดเชิงวิพากษ์ โดยการระบุประเด็นในคดีและตรวจสอบเหตุผลเบื้องหลังการตัดสินใจหรือคำวินิจฉัยก่อนหน้านี้ของศาล ศาล ได้ตัดสินอะไรไปบ้าง และเพราะเหตุใด โปรดจำไว้ว่าศาล โดยเฉพาะศาลฎีกาของสหรัฐอเมริกา ไม่เพียงแต่ตัดสินคดีใดคดีหนึ่งเท่านั้น แต่ยังกำหนดแนวทาง (ในคำวินิจฉัย) สำหรับศาลรัฐบาลกลางและศาลของรัฐต่างๆ ที่พบเจอกับประเด็นที่คล้ายคลึงกันด้วย โปรดทราบว่าคดีความมักก่อให้เกิดประเด็นหรือคำถามที่หลากหลาย และผู้พิพากษา (และทนายความ) จะมีความเห็นแตกต่างกันเกี่ยวกับประเด็นที่แท้จริงในคดี คำวินิจฉัยคือคำตอบที่สมบูรณ์ของศาลต่อประเด็นที่สำคัญต่อการตัดสินคดี และให้แนวทางเกี่ยวกับความหมายของคดีในฐานะที่เป็นบรรทัดฐานสำหรับคดีในอนาคต

นอกเหนือจากการตัดสินของศาลแล้ว การพิจารณา เหตุผลของศาลจะช่วยให้คุณเข้าใจว่าข้อเท็จจริงใดมีความสำคัญที่สุดต่อศาล และทฤษฎี (สำนักคิดทางกฎหมาย) ใดที่ผู้พิพากษาแต่ละคนเชื่อถือ เนื่องจากผู้พิพากษาไม่ได้เห็นพ้องต้องกันในหลักการพื้นฐานเสมอไป (เช่น พวกเขาเชื่อในสำนักคิดทางกฎหมายที่แตกต่างกัน) จึงมักมีความเห็นที่แตกต่างกันในคำตัดสินของศาลอุทธรณ์และในแต่ละวาระของศาลฎีกาสหรัฐฯ

ประเด็นสำคัญ
ระบบกฎหมายของสหรัฐอเมริกามีแหล่งที่มาของกฎหมายหลายแหล่ง รัฐธรรมนูญของสหรัฐอเมริกาเป็นรากฐานสำคัญ กฎหมายลายลักษณ์อักษรและกฎหมายจารีตประเพณีของสหรัฐอเมริกาจะต้องไม่ขัดแย้งกับบทบัญญัติของรัฐธรรมนูญ รัฐสภาเป็นผู้บัญญัติกฎหมาย (โดยมีลายเซ็นของประธานาธิบดี) และศาลจะเป็นผู้ตีความกฎหมายรัฐธรรมนูญและกฎหมายลายลักษณ์อักษร ในกรณีที่ไม่มีทั้งกฎหมายรัฐธรรมนูญและกฎหมายลายลักษณ์อักษร ศาลจะทำหน้าที่ภายใต้กฎหมายจารีตประเพณี เช่นเดียวกับกฎหมายในรัฐทั้งห้าสิบรัฐ ซึ่งแต่ละรัฐก็มีรัฐธรรมนูญหรือกฎหมายรากฐานของตนเองเช่นกัน

ทั้งรัฐบาลกลางและรัฐบาลของแต่ละรัฐได้จัดตั้งหน่วยงานบริหารขึ้น หน่วยงานจะมีอำนาจได้ก็ต่อเมื่อได้รับมอบอำนาจจากฝ่ายนิติบัญญัติเท่านั้น ภายในขอบเขตอำนาจนั้น หน่วยงานมักจะออกกฎระเบียบ (ดูบทที่ 5 "กฎหมายปกครอง" ) ซึ่งมีผลบังคับใช้เช่นเดียวกับกฎหมายที่บัญญัติขึ้น สนธิสัญญาจะไม่ถูกเจรจาและทำขึ้นโดยรัฐต่างๆ เนื่องจากรัฐบาลกลางมีอำนาจแต่เพียงผู้เดียวในการเจรจาความสัมพันธ์กับรัฐชาติอื่นๆ สนธิสัญญาเมื่อได้รับการให้สัตยาบันจากวุฒิสภาแล้ว จะมีผลบังคับใช้เช่นเดียวกับกฎหมายที่ผ่านโดยรัฐสภาและลงนามโดยประธานาธิบดี

รัฐธรรมนูญ กฎหมาย ข้อบังคับ สนธิสัญญา และคำพิพากษาของศาล สามารถเป็นพื้นฐานทางกฎหมายในกฎหมายลายลักษณ์อักษรได้ คุณอาจเชื่อว่าคุณถูกกระทำอย่างไม่เป็นธรรม แต่เพื่อให้คุณมีสิทธิที่สามารถบังคับใช้ได้ในศาล คุณต้องมีหลักฐานในกฎหมายลายลักษณ์อักษรที่สามารถชี้ให้เห็นเพื่อสนับสนุนข้อกล่าวหาต่อจำเลยที่คุณเลือก

แบบฝึกหัด
จงยกตัวอย่างหนึ่งกรณีที่กฎหมายจารีตประเพณีถูกยกเลิกโดยกฎหมายของรัฐบาลกลาง
กฎหมายจารีตประเพณีเปลี่ยนแปลงหรือพัฒนาไปได้อย่างไรโดยปราศจากการกระทำใดๆ จากฝ่ายนิติบัญญัติ?
ลินด์ซีย์ พาราไดซ์ ไม่ได้รับการคัดเลือกเข้าชมรมสตรีที่เธอเลือกที่มหาวิทยาลัยแคนซัส เธอใช้เวลาทั้งหมดไปกับการเข้าร่วมกิจกรรมรับสมัครของชมรมนั้น ซึ่งเลือกเพื่อนของเธอไปบ้าง แต่ไม่เลือกเธอ เธอผิดหวังและโกรธ และต้องการฟ้องร้องชมรมนั้น โอกาสที่เธอจะได้รับการชดเชยในระบบกฎหมายมีมากน้อยเพียงใด จงอธิบาย
1.5ระบบกฎหมายและระบบการเมืองของโลก
วัตถุประสงค์การเรียนรู้
อธิบายความแตกต่างระหว่างระบบกฎหมายจารีตประเพณีกับระบบกฎหมายแพ่ง
ระบบกฎหมายและระบบการเมืองของประเทศอื่นๆ แตกต่างจากระบบของสหรัฐอเมริกาอย่างมาก ซึ่งระบบของสหรัฐอเมริกามาจากประเพณีกฎหมายจารีตประเพณีของอังกฤษและผู้ร่างรัฐธรรมนูญของสหรัฐอเมริกา ประเพณีทางกฎหมายและระบบการเมืองของเราแตกต่างกันทั้งในประเภทของกฎหมายที่เราบัญญัติและปฏิบัติตาม และในวิธีการระงับข้อพิพาทในศาล

การเปรียบเทียบระบบกฎหมายจารีตประเพณีกับระบบกฎหมายอื่นๆ
ระบบกฎหมายจารีตประเพณีเป็นเอกลักษณ์เฉพาะของอังกฤษ สหรัฐอเมริกา และอดีตอาณานิคมของจักรวรรดิอังกฤษ แม้ว่าจะมีข้อแตกต่างกันในระบบกฎหมายจารีตประเพณี (เช่น ประเทศส่วนใหญ่ไม่อนุญาตให้ศาลประกาศว่ากฎหมายใดขัดต่อรัฐธรรมนูญ บางประเทศใช้คณะลูกขุนน้อยกว่า) แต่ทุกระบบต่างยอมรับการใช้หลักการตัดสินตามบรรทัดฐานในคดีความ และไม่มีระบบใดที่พึ่งพากฎหมายที่ครอบคลุมอย่างเต็มรูปแบบเหมือนในระบบกฎหมายแพ่ง

ระบบกฎหมายแพ่ง
ระบบกฎหมายทางเลือกหลักอีกระบบหนึ่งนอกเหนือจากระบบกฎหมายจารีตประเพณี คือระบบที่กฎหมายทั้งหมดถูกรวบรวมไว้ในกฎหมายฉบับเดียวหรือหลายฉบับ ในสมัยของนโปเลียน มีการรวบรวมกฎหมายฉบับสมบูรณ์—ประมวลกฎหมาย—สำหรับประเทศฝรั่งเศสทั้งหมด ประมวลกฎหมายนี้ครอบคลุมกฎหมายอาญา วิธีพิจารณาความอาญา กฎหมายและวิธีพิจารณาความที่ไม่ใช่อาญา และกฎหมายพาณิชย์ กฎเกณฑ์ในประมวลกฎหมายนี้ยังคงใช้กันอยู่ในปัจจุบันในประเทศฝรั่งเศสและระบบกฎหมายอื่นๆ ในทวีปยุโรป ประมวลกฎหมายนี้ใช้ในการตัดสินคดีต่างๆ โดยปกติแล้วผู้พิพากษาจะเป็นผู้ตัดสินโดยไม่มีคณะลูกขุน นอกจากนี้ ผู้พิพากษาไม่จำเป็นต้องปฏิบัติตามคำตัดสินของศาลอื่นๆ ในคดีที่คล้ายคลึงกัน ดังที่จอร์จ คาเมรอน จากมหาวิทยาลัยมิชิแกนได้กล่าวไว้ว่า “กฎหมายอยู่ในประมวลกฎหมาย ไม่ได้อยู่ในคดีต่างๆ” เขากล่าวต่อไปว่า “ในกรณีที่หลายคดีตีความบทบัญญัติเดียวกันในลักษณะเดียวกัน ศาลฝรั่งเศสอาจรู้สึกว่าจำเป็นต้องตัดสินคดีในอนาคตด้วยผลลัพธ์เดียวกัน ภายใต้หลักการนิติศาสตร์คงที่อย่างไรก็ตาม หน่วยงานหลักที่ขับเคลื่อนการเติบโตและการเปลี่ยนแปลงคือฝ่ายนิติบัญญัติ ไม่ใช่ศาล”

ระบบกฎหมายแพ่งถูกนำมาใช้ทั่วทั้งยุโรป รวมถึงในอเมริกากลางและอเมริกาใต้ บางประเทศในเอเชียและแอฟริกาก็ได้นำประมวลกฎหมายที่อิงตามกฎหมายแพ่งของยุโรปมาใช้เช่นกัน เยอรมนี เนเธอร์แลนด์ สเปน ฝรั่งเศส และโปรตุเกส ต่างก็เคยมีอาณานิคมอยู่นอกยุโรป และอาณานิคมเหล่านี้หลายแห่งได้นำเอาหลักปฏิบัติทางกฎหมายที่ถูกกำหนดโดยการปกครองอาณานิคมมาใช้ เช่นเดียวกับรัฐทั้งสิบสามรัฐดั้งเดิมของสหรัฐอเมริกา ซึ่งนำเอาหลักปฏิบัติทางกฎหมายจารีตประเพณีของอังกฤษมาใช้

สิ่งหนึ่งที่อาจทำให้เกิดความสับสนในจุดนี้คือ เราได้กล่าวถึงกฎหมายแพ่งของสหรัฐอเมริกาไปแล้ว ซึ่งแตกต่างจากกฎหมายอาญา แต่กฎหมายแพ่งของยุโรปครอบคลุมทั้งกฎหมายแพ่งและกฎหมายอาญา

นอกจากนี้ยังมีระบบกฎหมายที่แตกต่างอย่างมากจากระบบกฎหมายจารีตประเพณีและระบบกฎหมายแพ่ง ระบบกฎหมายคอมมิวนิสต์และสังคมนิยมที่ยังคงอยู่ (เช่น ในคิวบาและเกาหลีเหนือ) ดำเนินการบนสมมติฐานที่แตกต่างจากระบบกฎหมายจารีตประเพณีของอังกฤษหรือระบบกฎหมายแพ่งของยุโรปอย่างมาก ระบบกฎหมายอิสลามและระบบกฎหมายอื่นๆ ที่อิงศาสนา นำมาซึ่งค่านิยมและสมมติฐานที่แตกต่างกันในความสัมพันธ์ทางสังคมและการค้า

ประเด็นสำคัญ
ระบบกฎหมายมีความแตกต่างกันอย่างมากทั้งในด้านเป้าหมายและวิธีการดำเนินคดีแพ่งและคดีอาญา ระบบกฎหมายจารีตประเพณีใช้คณะลูกขุน มีผู้พิพากษาหนึ่งคน และยึดถือหลักการตัดสินตามคดีก่อนหน้า ส่วนระบบกฎหมายแพ่งตัดสินคดีโดยไม่ต้องใช้คณะลูกขุน มักใช้ผู้พิพากษาสามคน และมักออกคำตัดสินที่สั้นกว่าโดยไม่กล่าวถึงคดีที่เคยตัดสินไปแล้ว

ออกกำลังกาย
ใช้ข้อมูลทางอินเทอร์เน็ตเพื่อค้นหาประเทศที่มีชื่อเสียงบางประเทศที่มีระบบกฎหมายแพ่ง ประเทศในเอเชียใดบ้างที่นำระบบกฎหมายแพ่งมาใช้ทั้งหมดหรือบางส่วน และเพราะเหตุใด
1.6ตัวอย่างกรณีศึกษา
หมายเหตุเบื้องต้นสำหรับนักเรียน

มาตรา 7 แห่งพระราชบัญญัติสิทธิพลเมืองปี 1964 เป็นกฎหมายของรัฐบาลกลางที่ใช้บังคับกับนายจ้างทุกรายที่มีพนักงานเกินสิบห้าคน ข้อความในมาตรา 7 ระบุว่า

(ก) การกระทำดังกล่าวถือเป็นการปฏิบัติการจ้างงานที่ไม่ชอบด้วยกฎหมายสำหรับนายจ้าง—

(1) การไม่จ้างหรือปฏิเสธที่จะจ้างหรือไล่บุคคลใดออก หรือการเลือกปฏิบัติกับบุคคลใดในเรื่องค่าตอบแทน เงื่อนไข สิทธิประโยชน์ หรือสิทธิพิเศษในการจ้างงาน อันเนื่องมาจากเชื้อชาติ สีผิว ศาสนา เพศ หรือถิ่นกำเนิดของบุคคลนั้น

ในระบบกฎหมายทั่วไป—ที่ผู้พิพากษาตัดสินคดีโดยไม่คำนึงถึงบทบัญญัติของกฎหมาย—โดยทั่วไปแล้วนายจ้างมีอิสระที่จะจ้างและเลิกจ้างได้ด้วยเหตุผลใดๆ ก็ตามที่ตนเลือก และโดยทั่วไปแล้วลูกจ้างมีอิสระที่จะทำงานให้กับนายจ้างหรือลาออกจากนายจ้างได้ด้วยเหตุผลใดๆ ก็ตามที่ตนเลือก (เว้นแต่ว่านายจ้างและลูกจ้างจะมีสัญญาจ้างงานกัน) กฎนี้เรียกว่า “การจ้างงานตามความสมัครใจ” กฎหมายของรัฐและรัฐบาลกลางที่ห้ามการเลือกปฏิบัติไม่ว่าด้วยเหตุผลใดๆ (เช่น ข้อห้ามการเลือกปฏิบัติเนื่องจากเชื้อชาติ สีผิว ศาสนา เพศ หรือแหล่งกำเนิดในมาตรา VII) นั้นโดยพื้นฐานแล้วเป็นข้อยกเว้นทางกฎหมายของกฎการจ้างงานตามความสมัครใจในระบบกฎหมายทั่วไป

ในทศวรรษ 1970 พนักงานหญิงจำนวนมากเริ่มออกมาเรียกร้องเกี่ยวกับการเลือกปฏิบัติทางเพศรูปแบบหนึ่ง นั่นคือ การคุกคามทางเพศ ผู้หญิงบางคนถูกขอให้ให้ความช่วยเหลือทางเพศเพื่อแลกกับการได้ทำงานต่อหรือได้รับการเลื่อนตำแหน่ง (การคุกคามทางเพศแบบแลกเปลี่ยนผลประโยชน์) หรือพบว่าตนเองอยู่ในสภาพแวดล้อมการทำงานที่ทำให้โอกาสในการได้ทำงานต่อหรือได้รับการเลื่อนตำแหน่งของพวกเธอตกอยู่ในความเสี่ยง การเลือกปฏิบัติทางเพศในรูปแบบนี้จึงถูกเรียกว่า การคุกคามทางเพศใน "สภาพแวดล้อมการทำงานที่ไม่เป็นมิตร"

โปรดสังเกตว่ากฎหมายฉบับนี้ไม่ได้กล่าวถึงการคุกคามทางเพศโดยตรง แต่กล่าวถึงการเลือกปฏิบัติ “เนื่องจาก” เพศ (และปัจจัยอื่นๆ อีกสี่ประการ) ในวงกว้างเท่านั้น เมื่อกำหนดนโยบายในวงกว้างแล้ว รัฐสภาจึงปล่อยให้ลูกจ้าง นายจ้าง และศาลเป็นผู้กำหนดกฎเกณฑ์ที่เฉพาะเจาะจงมากขึ้นผ่านกระบวนการฟ้องร้องทางแพ่ง

นี่เป็นคดีจากระบบศาลรัฐบาลกลางของเรา ซึ่งมีการพิจารณาคดีหรือการไต่สวนในศาลแขวงรัฐบาลกลาง การอุทธรณ์ไปยังศาลอุทธรณ์เขตที่หก และการอุทธรณ์ขั้นสุดท้ายไปยังศาลฎีกาสหรัฐฯ เทเรซา แฮร์ริส ซึ่งแพ้คดีทั้งในศาลแขวงและศาลอุทธรณ์เขตที่หก ได้ยื่นคำร้องขอให้ศาลฎีกาพิจารณาคดี (ขอให้ศาลออกคำสั่งนำคดีขึ้นสู่ศาลฎีกา) ซึ่งเป็นคำร้องที่ศาลฎีกาอนุมัติน้อยกว่าหนึ่งในห้าสิบครั้ง กล่าวอีกนัยหนึ่ง ศาลฎีกาเลือกคดีอย่างระมัดระวัง ในกรณีนี้ ศาลต้องการหาข้อสรุปเกี่ยวกับความเห็นที่แตกต่างกันระหว่างศาลอุทธรณ์เขตต่างๆ ว่าโจทก์ในคดีเรียกร้องค่าเสียหายจากสภาพแวดล้อมการทำงานที่ไม่เป็นมิตรจะสามารถเรียกร้องค่าเสียหายได้หรือไม่โดยไม่ต้องแสดงให้เห็นถึง “การบาดเจ็บทางจิตใจอย่างรุนแรง”

แฮร์ริส ปะทะ ฟอร์คลิฟท์ ซิสเต็มส์

510 US 17 (ศาลฎีกาสหรัฐอเมริกา 1992)

ผู้พิพากษา: ผู้พิพากษาโอคอนเนอร์ เป็นผู้เขียนคำตัดสินของศาลโดยมีมติเป็นเอกฉันท์ ผู้พิพากษาสกาเลีย และผู้พิพากษากินส์เบิร์ก เขียนความเห็นเพิ่มเติมประกอบ

ผู้พิพากษาโอคอนเนอร์ได้แถลงความเห็นของศาล

ในกรณีนี้ เราจะพิจารณาคำจำกัดความของ “สภาพแวดล้อมการทำงานที่ไม่เป็นธรรม” (หรือที่รู้จักกันในชื่อ “สภาพแวดล้อมการทำงานที่เป็นปรปักษ์”) ที่มีการเลือกปฏิบัติภายใต้มาตรา VII ของพระราชบัญญัติสิทธิพลเมืองปี 1964, 78 Stat. 253, ตามที่แก้ไขเพิ่มเติม, 42 USC § 2000e et seq. (ฉบับปี 1988, ภาคผนวก III)

ฉัน

เทเรซา แฮร์ริส ทำงานเป็นผู้จัดการที่บริษัท Forklift Systems, Inc. ซึ่งเป็นบริษัทให้เช่าอุปกรณ์ ตั้งแต่เดือนเมษายน 1985 จนถึงเดือนตุลาคม 1987 โดยมีชาร์ลส์ ฮาร์ดี เป็นประธานบริษัท Forklift

ผู้พิพากษาพบว่า ตลอดระยะเวลาที่แฮร์ริสทำงานที่บริษัทฟอร์คลิฟต์ ฮาร์ดี้มักดูหมิ่นเธอเนื่องจากเพศของเธอ และมักใช้คำพูดเชิงลามกกับเธออยู่บ่อยครั้ง ฮาร์ดี้เคยบอกแฮร์ริสหลายครั้งต่อหน้าพนักงานคนอื่นๆ ว่า “เธอเป็นผู้หญิง เธอจะรู้อะไร” และ “เราต้องการผู้ชายมาเป็นผู้จัดการฝ่ายเช่า” อย่างน้อยหนึ่งครั้ง เขาบอกเธอว่าเธอเป็น “ผู้หญิงโง่ๆ” และต่อหน้าคนอื่นๆ เขายังแนะนำว่าทั้งสองคนควร “ไปที่ฮอลิเดย์อินน์เพื่อเจรจาเรื่องการขึ้นเงินเดือนของแฮร์ริส” ฮาร์ดี้มักขอให้แฮร์ริสและพนักงานหญิงคนอื่นๆ หยิบเหรียญจากกระเป๋ากางเกงด้านหน้าของเขา เขามักโยนสิ่งของลงพื้นต่อหน้าแฮร์ริสและผู้หญิงคนอื่นๆ แล้วขอให้พวกเธอเก็บสิ่งของเหล่านั้นขึ้นมา เขายังพูดจาเชิงลามกเกี่ยวกับเสื้อผ้าของแฮร์ริสและผู้หญิงคนอื่นๆ ด้วย

ในช่วงกลางเดือนสิงหาคม ปี 1987 แฮร์ริสได้ร้องเรียนเรื่องพฤติกรรมของฮาร์ดี้ ฮาร์ดี้กล่าวว่าเขาประหลาดใจที่แฮร์ริสรู้สึกไม่พอใจ อ้างว่าเขาแค่ล้อเล่น และขอโทษ เขายังสัญญาว่าจะหยุด และด้วยคำมั่นสัญญานี้ แฮร์ริสจึงยังคงทำงานต่อไป แต่ในช่วงต้นเดือนกันยายน ฮาร์ดี้ก็เริ่มเรื่องใหม่: ขณะที่แฮร์ริสกำลังจัดการข้อตกลงกับลูกค้ารายหนึ่งของบริษัทฟอร์คลิฟต์ เขาถามเธออีกครั้งต่อหน้าพนักงานคนอื่นๆ ว่า “คุณทำอะไรไว้ สัญญากับผู้ชายคนนั้นว่าจะมีเซ็กส์ในคืนวันเสาร์เหรอ?” ในวันที่ 1 ตุลาคม แฮร์ริสรับเงินเดือนและลาออก

จากนั้นแฮร์ริสจึงฟ้องร้องบริษัทฟอร์คลิฟต์ โดยอ้างว่าพฤติกรรมของฮาร์ดี้ได้สร้างสภาพแวดล้อมการทำงานที่ไม่เป็นธรรมต่อเธอเนื่องจากเพศของเธอ ศาลแขวงสหรัฐฯ เขตมิดเดิลดิสทริกต์แห่งเทนเนสซี ได้นำรายงานและคำแนะนำของผู้พิพากษามาใช้ และพบว่าคดีนี้เป็น “คดีที่ตัดสินยาก” แต่ตัดสินว่าพฤติกรรมของฮาร์ดี้ไม่ได้สร้างสภาพแวดล้อมที่ไม่เป็นธรรม ศาลพบว่าคำพูดบางส่วนของฮาร์ดี้ “ทำให้ [แฮร์ริส] รู้สึกไม่พอใจ และจะทำให้ผู้หญิงทั่วไปรู้สึกไม่พอใจเช่นกัน” แต่คำพูดเหล่านั้น “ไม่ได้รุนแรงถึงขนาดที่จะส่งผลกระทบต่อสุขภาพจิตของ [แฮร์ริส] อย่างจริงจัง ผู้จัดการหญิงทั่วไปภายใต้สถานการณ์เดียวกันคงจะรู้สึกไม่พอใจกับฮาร์ดี้ แต่พฤติกรรมของเขาคงไม่ถึงขั้นที่จะรบกวนประสิทธิภาพการทำงานของบุคคลนั้น”

“ฉันไม่เชื่อว่า [แฮร์ริส] จะรู้สึกขุ่นเคืองใจถึงขั้นได้รับบาดเจ็บทางจิตใจ…แม้ว่าฮาร์ดี้อาจจะเคยทำให้ [แฮร์ริส] รู้สึกขุ่นเคืองใจบ้างในบางครั้ง แต่ฉันไม่เชื่อว่าเขาได้สร้างสภาพแวดล้อมการทำงานที่เป็นพิษถึงขั้นทำให้ [แฮร์ริส] รู้สึกหวาดกลัวหรือถูกล่วงละเมิด”

ในการให้ความสำคัญกับสุขภาวะทางจิตใจของพนักงาน ศาลแขวงได้ปฏิบัติตามแบบอย่างของศาลอุทธรณ์ ดู Rabidue v. Osceola Refining Co., 805 F.2d 611, 620 (CA6 1986), cert. denied, 481 US 1041, 95 L. Ed. 2d 823, 107 S. Ct. 1983 (1987) ศาลอุทธรณ์แห่งสหรัฐอเมริกาประจำเขตที่ 6 ได้ยืนยันคำตัดสินโดยย่อที่ไม่ได้ตีพิมพ์…รายงานที่ 976 F.2d 733 (1992)

เราได้อนุมัติคำร้องขอพิจารณาคดีใหม่ (certiorari) 507 US 959 (1993) เพื่อแก้ไขความขัดแย้งระหว่างศาลอุทธรณ์ระดับภูมิภาคเกี่ยวกับว่าพฤติกรรมที่จะสามารถฟ้องร้องได้ในฐานะการคุกคามใน “สภาพแวดล้อมการทำงานที่ไม่เหมาะสม” (ไม่มีประเด็นการคุกคามแบบแลกเปลี่ยนผลประโยชน์ในกรณีนี้) จะต้อง “ส่งผลกระทบอย่างร้ายแรงต่อสุขภาพจิตของ [พนักงาน]” หรือทำให้โจทก์ “ได้รับบาดเจ็บ” หรือไม่ เปรียบเทียบกับ Rabidue (ซึ่งกำหนดให้ต้องมีผลกระทบอย่างร้ายแรงต่อสุขภาพจิต); Vance v. Southern Bell Telephone & Telegraph Co., 863 F.2d 1503, 1510 (CA11 1989) (เช่นเดียวกัน) และ Downes v. FAA, 775 F.2d 288, 292 (CA Fed. 1985) (เช่นเดียวกัน) กับ Ellison v. Brady, 924 F.2d 872, 877–878 (CA9 1991) (ปฏิเสธข้อกำหนดดังกล่าว)

2.

มาตรา VII ของพระราชบัญญัติสิทธิพลเมืองปี 1964 บัญญัติว่า “นายจ้าง…เลือกปฏิบัติกับบุคคลใดบุคคลหนึ่งเกี่ยวกับค่าตอบแทน เงื่อนไข สภาพ หรือสิทธิพิเศษในการจ้างงาน เนื่องจากเชื้อชาติ สีผิว ศาสนา เพศ หรือสัญชาติของบุคคลนั้น ถือเป็นการปฏิบัติการจ้างงานที่ไม่ชอบด้วยกฎหมาย” 42 USC § 2000e-2(a)(1) ดังที่เราได้ชี้แจงไว้ในคดี Meritor Savings Bank, FSB v. Vinson, 477 US 57 (1986) ว่าถ้อยคำดังกล่าว “ไม่ได้จำกัดเฉพาะการเลือกปฏิบัติทาง ‘เศรษฐกิจ’ หรือ ‘รูปธรรม’ เท่านั้น วลี ‘เงื่อนไข สภาพ หรือสิทธิพิเศษในการจ้างงาน’ แสดงให้เห็นถึงเจตนารมณ์ของรัฐสภา ‘ที่จะจัดการกับการปฏิบัติที่ไม่เท่าเทียมกันระหว่างชายและหญิงในทุกแง่มุม’ ในการจ้างงาน” ซึ่งรวมถึงการบังคับให้บุคคลทำงานในสภาพแวดล้อมที่เป็นปรปักษ์หรือเป็นการล่วงละเมิดอย่างเลือกปฏิบัติ อ้างอิงจาก Id., ที่ 64, อ้างถึง Los Angeles Dept. of Water and Power v. Manhart, 435 US 702, 707, n.13, 55 L. Ed. 2d 657, 98 S. Ct. 1370 (1978) เมื่อสถานที่ทำงานเต็มไปด้วย “การข่มขู่ การเยาะเย้ย และการดูหมิ่นเหยียดหยามที่เป็นการเลือกปฏิบัติ” 477 US ที่ 65 ซึ่ง “รุนแรงหรือแพร่หลายมากพอที่จะเปลี่ยนแปลงเงื่อนไขการจ้างงานของเหยื่อและสร้างสภาพแวดล้อมการทำงานที่ไม่เหมาะสม” ถือเป็นการละเมิด Title VII

มาตรฐานนี้ ซึ่งเรายืนยันอีกครั้งในวันนี้ ยึดหลักทางสายกลางระหว่างการทำให้พฤติกรรมใดๆ ที่เป็นเพียงการดูหมิ่นเหยียดหยามกลายเป็นความผิดทางกฎหมาย และการกำหนดให้พฤติกรรมนั้นต้องก่อให้เกิดความเสียหายทางจิตใจอย่างเป็นรูปธรรม ดังที่เราได้ชี้แจงไว้ในคดี Meritor ว่า “เพียงแค่การเอ่ยคำพูดดูหมิ่นเหยียดหยามที่ก่อให้เกิดความรู้สึกไม่พอใจในตัวพนักงาน” นั้น ไม่เพียงพอที่จะส่งผลกระทบต่อสภาพการจ้างงานจนเข้าข่ายความผิดตามมาตรา VII พฤติกรรมที่ไม่รุนแรงหรือแพร่หลายมากพอที่จะสร้างสภาพแวดล้อมการทำงานที่เป็นปรปักษ์หรือเป็นการล่วงละเมิดอย่างเป็นรูปธรรม ซึ่งเป็นสภาพแวดล้อมที่บุคคลทั่วไปจะมองว่าเป็นปรปักษ์หรือเป็นการล่วงละเมิดนั้น อยู่นอกเหนือขอบเขตของมาตรา VII ในทำนองเดียวกัน หากผู้เสียหายไม่ได้มองว่าสภาพแวดล้อมนั้นเป็นการล่วงละเมิด พฤติกรรมนั้นก็ไม่ได้เปลี่ยนแปลงสภาพการจ้างงานของผู้เสียหาย และไม่มีการละเมิดมาตรา VII เกิดขึ้น

แต่มาตรา VII จะมีผลบังคับใช้ก่อนที่พฤติกรรมคุกคามจะนำไปสู่ภาวะทางจิตใจที่ย่ำแย่ สภาพแวดล้อมการทำงานที่เลือกปฏิบัติ แม้ว่าจะไม่ส่งผลกระทบอย่างร้ายแรงต่อสุขภาพจิตของพนักงาน ก็สามารถและมักจะบั่นทอนประสิทธิภาพการทำงานของพนักงาน ทำให้พนักงานท้อแท้ที่จะทำงานต่อไป หรือขัดขวางความก้าวหน้าในอาชีพการงาน ยิ่งไปกว่านั้น แม้จะไม่คำนึงถึงผลกระทบที่จับต้องได้เหล่านี้ ข้อเท็จจริงที่ว่าพฤติกรรมเลือกปฏิบัตินั้นรุนแรงหรือแพร่หลายจนสร้างสภาพแวดล้อมการทำงานที่ไม่เหมาะสมต่อพนักงานเนื่องจากเชื้อชาติ เพศ ศาสนา หรือแหล่งกำเนิดของพวกเขา ก็ขัดต่อหลักการความเท่าเทียมกันในที่ทำงานของมาตรา VII แล้ว พฤติกรรมที่น่าตกใจที่ถูกกล่าวหาในคดี Meritor และการอ้างอิงในคดีนั้นถึงสภาพแวดล้อม “'ปนเปื้อนด้วยการเลือกปฏิบัติอย่างหนักจนทำลายเสถียรภาพทางอารมณ์และจิตใจของคนงานกลุ่มน้อยอย่างสิ้นเชิง'” Id., ที่ 66 อ้างอิงจาก Rogers v. EEOC, 454 F.2d 234, 238 (CA5 1971), cert. คำร้องที่ถูกปฏิเสธ 406 US 957, 32 L. Ed. 2d 343, 92 S. Ct. 2058 (1972) เป็นเพียงตัวอย่างการคุกคามที่ร้ายแรงเป็นพิเศษเท่านั้น ไม่ได้เป็นตัวกำหนดขอบเขตของสิ่งที่สามารถฟ้องร้องได้

ดังนั้น เราจึงเชื่อว่าศาลแขวงได้กระทำผิดพลาดในการพิจารณาว่าพฤติกรรมดังกล่าว “ส่งผลกระทบอย่างร้ายแรงต่อสุขภาพจิตของโจทก์” หรือทำให้เธอ “ได้รับบาดเจ็บ” หรือไม่ การสอบสวนเช่นนั้นอาจทำให้ผู้พิจารณาข้อเท็จจริงมุ่งความสนใจไปที่ความเสียหายทางจิตใจที่เป็นรูปธรรมโดยไม่จำเป็น ซึ่งเป็นองค์ประกอบที่มาตรา 7 แห่งกฎหมายสิทธิพลเมืองไม่ได้กำหนดไว้ แน่นอนว่ามาตรา 7 แห่งกฎหมายสิทธิพลเมืองห้ามพฤติกรรมที่จะส่งผลกระทบอย่างร้ายแรงต่อสุขภาพจิตของบุคคลทั่วไป แต่กฎหมายไม่ได้จำกัดอยู่เฉพาะพฤติกรรมดังกล่าว ตราบใดที่สภาพแวดล้อมนั้นสามารถรับรู้ได้อย่างสมเหตุสมผล และถูกรับรู้แล้ว ว่าเป็นสภาพแวดล้อมที่เป็นปรปักษ์หรือเป็นการล่วงละเมิด (Meritor, supra, ที่ 67) ก็ไม่จำเป็นต้องเป็นอันตรายทางจิตใจด้วย

นี่ไม่ใช่ และโดยธรรมชาติแล้วไม่สามารถเป็น การทดสอบที่แม่นยำทางคณิตศาสตร์ได้ เราไม่จำเป็นต้องตอบคำถามที่อาจเกิดขึ้นทั้งหมดในวันนี้ หรือกล่าวถึงระเบียบใหม่ของคณะกรรมการโอกาสการจ้างงานที่เท่าเทียมกันในเรื่องนี้โดยเฉพาะ ดู 58 Fed. Reg. 51266 (1993) (ข้อเสนอ 29 CFR §§ 1609.1, 1609.2); ดูเพิ่มเติมที่ 29 CFR § 1604.11 (1993) แต่เราสามารถกล่าวได้ว่า สภาพแวดล้อมนั้น “เป็นปรปักษ์” หรือ “เป็นการล่วงละเมิด” หรือไม่นั้น สามารถพิจารณาได้จากการพิจารณาสถานการณ์ทั้งหมด ซึ่งอาจรวมถึงความถี่ของการกระทำที่เลือกปฏิบัติ ความรุนแรงของการกระทำนั้น ไม่ว่าจะเป็นการคุกคามทางร่างกายหรือการทำให้เสียเกียรติ หรือเป็นเพียงคำพูดที่ไม่เหมาะสม และไม่ว่าจะเป็นการรบกวนการทำงานของพนักงานอย่างไม่สมเหตุสมผลหรือไม่ ผลกระทบต่อสุขภาพจิตของพนักงานนั้นมีความเกี่ยวข้องกับการพิจารณาว่าโจทก์พบว่าสภาพแวดล้อมนั้นเป็นการล่วงละเมิดจริงหรือไม่ แต่ถึงแม้ว่าความเสียหายทางจิตใจ เช่นเดียวกับปัจจัยอื่นๆ ที่เกี่ยวข้อง อาจถูกนำมาพิจารณาได้ แต่ก็ไม่มีปัจจัยใดปัจจัยหนึ่งที่จำเป็นเสมอไป

3.

แม้ว่า Forklift จะยอมรับว่าข้อกำหนดที่ว่าพฤติกรรมดังกล่าวต้องส่งผลกระทบอย่างร้ายแรงต่อสุขภาพจิตนั้นไม่มีมูลความจริง แต่ศาลชั้นต้นก็ยังคงใช้มาตรฐาน Meritor อย่างถูกต้อง เราไม่เห็นด้วย แม้ว่าศาลชั้นต้นจะสรุปว่าสภาพแวดล้อมในการทำงานไม่ได้ “น่าหวาดกลัวหรือเป็นการล่วงละเมิดต่อ [Harris]” แต่ศาลก็สรุปเช่นนั้นหลังจากที่พบว่าพฤติกรรมดังกล่าว “ไม่ได้รุนแรงถึงขนาดที่จะคาดว่าจะส่งผลกระทบอย่างร้ายแรงต่อสุขภาพจิตของโจทก์” และ Harris ไม่ได้ “รู้สึกขุ่นเคืองใจจนถึงขั้นได้รับบาดเจ็บ” การที่ศาลชั้นต้นนำมาตรฐานที่ไม่ถูกต้องเหล่านี้มาใช้ อาจส่งผลต่อข้อสรุปสุดท้ายของศาล โดยเฉพาะอย่างยิ่งเมื่อศาลพบว่านี่เป็น “คดีที่ตัดสินยาก”

ดังนั้น เราจึงกลับคำพิพากษาของศาลอุทธรณ์ และส่งคดีกลับไปเพื่อดำเนินการต่อไปตามความเห็นนี้

ตามคำสั่งนั้น

หมายเหตุสำหรับนักเรียน

นี่เป็นเพียงครั้งที่สองที่ศาลฎีกาตัดสินคดีเกี่ยวกับการล่วงละเมิดทางเพศ นักวิชาการด้านกฎหมายสตรีนิยมหลายคนเกรงว่าศาลจะยกระดับมาตรฐานและทำให้การเรียกร้องค่าเสียหายจากสภาพแวดล้อมการทำงานที่ไม่เป็นมิตรภายใต้มาตรา 7 ยากขึ้น แต่สิ่งนั้นไม่ได้เกิดขึ้น เมื่อรวมคำถามที่จะต้องตัดสินเข้ากับการตัดสินของศาล เราจะได้ข้อสรุปของคดี ในที่นี้ คำถามที่ศาลตั้งขึ้นบวกกับคำตอบของศาล นำไปสู่ข้อสรุปที่ว่า “ลูกจ้างไม่จำเป็นต้องพิสูจน์ความเสียหายทางจิตใจอย่างรุนแรงเพื่อที่จะชนะคดีล่วงละเมิดทางเพศภายใต้มาตรา 7” ข้อสรุปนี้จะเป็นจริงจนกว่าศาลจะพิจารณาคำถามที่คล้ายกันอีกครั้งและให้คำตอบที่แตกต่างออกไป ซึ่งเกิดขึ้นบ้าง แต่เกิดขึ้นไม่บ่อยนัก

คำถามกรณีศึกษา
นี่เป็นคดีอาญาหรือคดีแพ่ง? จะดูออกได้อย่างไร?
ศาลกำลังพิจารณาออกกฎระเบียบทางด้านกระบวนการ หรือกำลังออกแถลงการณ์เกี่ยวกับกฎหมายสาระสำคัญกันแน่?
ในกรณีนี้ ศาลกำลังตีความรัฐธรรมนูญ กฎหมายของรัฐบาลกลาง กฎหมายของรัฐ หรือกฎหมายจารีตประเพณีหรือไม่?
ใน คดี Harris v. Forkliftถ้าหากผู้พิพากษาในศาลชั้นต้นไม่เห็นด้วยเป็นการส่วนตัวว่าผู้หญิงควรมีสิทธิได้รับการปฏิบัติอย่างเท่าเทียมกันในที่ทำงาน ทำไมผู้พิพากษาไม่ควรยกฟ้องคดีตั้งแต่ก่อนการพิจารณาคดี หรือควรยกฟ้องคดีหลังจากให้โอกาสโจทก์หญิงได้ชี้แจงข้อเท็จจริงในศาลแล้ว?
ในกรณีนี้ นายจ้างให้เหตุผลอย่างไร คุณเห็นด้วยหรือไม่เห็นด้วยกับเหตุผลนั้น? แล้วถ้าหากผู้ที่ออกกฎหมายเกี่ยวกับมาตรา VII ไม่ได้พิจารณาถึงความร้ายแรงของการบาดเจ็บเลยล่ะ?
1.7สรุปและแบบฝึกหัด
สรุป
มีความเข้าใจที่แตกต่างกันเกี่ยวกับกฎหมายคืออะไรและกฎหมายควรเป็นอย่างไร กฎหมายและระบบกฎหมายแตกต่างกันไปทั่วโลก ระบบกฎหมายในสหรัฐอเมริกาตั้งอยู่บนพื้นฐานของรัฐธรรมนูญสหรัฐฯ ซึ่งได้รับแรงบันดาลใจจากทฤษฎีกฎธรรมชาติและแนวคิดที่ว่าประชาชนมีสิทธิที่ไม่สามารถถูกรัฐบาลพรากไปได้ แต่รัฐบาลสามารถปกป้องสิทธิเหล่านั้นได้เท่านั้น หน้าที่ต่างๆ ของกฎหมายนั้นทำได้ดีหรือไม่ดีขึ้นอยู่กับประเทศที่คุณพิจารณา บางประเทศทำได้ดีมากในแง่ของการรักษาความสงบเรียบร้อย ในขณะที่บางประเทศทำได้ดีกว่าในแง่ของการให้เสรีภาพทางพลเมืองและทางการเมือง การเคลื่อนไหวทางสังคมและการเมืองภายในแต่ละประเทศส่งผลกระทบอย่างมากต่อลักษณะและคุณภาพของระบบกฎหมายภายในประเทศนั้นๆ

บทนี้ได้แนะนำให้คุณรู้จักกับสำนักคิดทางกฎหมายพื้นฐานบางประการ เช่น กฎหมายธรรมชาติ กฎหมายลายลักษณ์อักษร สัจนิยมทางกฎหมาย และการศึกษากฎหมายเชิงวิพากษ์ นอกจากนี้ยังได้ให้พื้นฐานโดยสังเขปเกี่ยวกับกฎหมายจารีตประเพณี รวมถึงสัญญา การละเมิด และกฎหมายอาญา ความแตกต่างระหว่างคดีแพ่งและคดีอาญา สาระสำคัญและกระบวนการ และแหล่งที่มาของกฎหมายต่างๆ ก็ได้รับการทบทวนแล้วเช่นกัน แหล่งที่มาแต่ละแหล่งมีระดับอำนาจที่แตกต่างกัน โดยเริ่มต้นจากรัฐธรรมนูญ ซึ่งเป็นกฎหมายหลักและจะลบล้างกฎหมายของศาลชั้นล่างใดๆ ที่ไม่สอดคล้องกับหลักการและบทบัญญัติของรัฐธรรมนูญ ความแตกต่างพื้นฐานระหว่างระบบกฎหมายจารีตประเพณีและระบบกฎหมายแพ่ง (ภาคพื้นทวีป หรือยุโรป) ก็ได้รับการกล่าวถึงเช่นกัน

แบบฝึกหัด
กฎหมายจารีตประเพณีคืออะไร? ศาลได้รับอำนาจในการตีความและเปลี่ยนแปลงกฎหมายนี้จากที่ใด?
หลังสงครามโลกครั้งที่สองสิ้นสุดลงในปี 1945 มีศาลระหว่างประเทศที่นูเรมเบิร์กซึ่งดำเนินคดีกับเจ้าหน้าที่หลายคนในไรช์ที่สามของเยอรมนีที่กระทำ “อาชญากรรมต่อมนุษยชาติ” หลายคนอ้างว่าพวกเขาเพียงแค่ “ทำตามคำสั่ง” ของอดอล์ฟ ฮิตเลอร์และผู้ช่วยคนสำคัญของเขา พวกเขาละเมิดกฎหมายใดบ้างหรือไม่?
หลักการ stare decisis หมายความว่า อย่างไรและเหตุใดจึงมีความสำคัญอย่างยิ่งต่อธรรมเนียมปฏิบัติทางกฎหมายแบบกฎหมายจารีตประเพณี?
ในสถานการณ์ต่อไปนี้ กฎหมายฉบับใดมีผลบังคับใช้เหนือกว่า และเพราะเหตุใด?

กฎหมายของรัฐขัดแย้งกับกฎหมายจารีตประเพณีของรัฐนั้น
กฎหมายของรัฐบาลกลางขัดแย้งกับรัฐธรรมนูญของสหรัฐอเมริกา
คำตัดสินตามกฎหมายจารีตประเพณีในรัฐหนึ่งขัดแย้งกับรัฐธรรมนูญของสหรัฐอเมริกา
กฎหมายของรัฐบาลกลางขัดแย้งกับรัฐธรรมนูญของรัฐ
คำถามทดสอบตนเอง
แหล่งที่มาของกฎหมายที่เป็นรากฐานของระบบกฎหมายของสหรัฐอเมริกาคือ

