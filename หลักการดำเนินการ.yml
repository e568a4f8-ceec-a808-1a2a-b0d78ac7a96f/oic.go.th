ในการใช้เหตุผลของมนุษย์
ในวอลล์สตรีทเจอร์นัล
วูล์ฟเป็นผู้พิพากษาศาลรัฐในแคลิฟอร์เนีย ในคดีRiddick v. Clouseซึ่งเกี่ยวข้องกับข้อพิพาททางสัญญา วูล์ฟต้องปฏิบัติตามหลักการตัดสินคดีก่อนหน้า เธอสร้างความสัมพันธ์เชิงตรรกะระหว่างคดี Riddick กับคดีที่ศาลฎีกาแคลิฟอร์เนียตัดสินไว้ คือZhu v. Patel Enterprises, Inc.เธอเปรียบเทียบข้อเท็จจริงของคดี Riddick กับข้อเท็จจริงในคดี Zhu และในส่วนที่ข้อเท็จจริงคล้ายคลึงกัน เธอใช้กฎเดียวกันในการตัดสินใจ นี่คือ

การให้เหตุผลแบบนิรนัย
การให้เหตุผลที่ผิดพลาด
การให้เหตุผลเชิงเส้น
การให้เหตุผลโดยการเปรียบเทียบ
มัวร์เป็นผู้พิพากษาศาลรัฐในโคโลราโด ในคดีCassidy v. Seawellซึ่งเป็นข้อพิพาทเรื่องสัญญาเช่นกัน ไม่มีคำตัดสินของศาลฎีกาหรือศาลอุทธรณ์ของโคโลราโดที่กำหนดหลักเกณฑ์ที่สามารถนำมาใช้ได้ อย่างไรก็ตาม คดีZhu v. Patel Enterprises, Inc. ใน แคลิฟอร์เนีย มีข้อเท็จจริงที่ "ใกล้เคียงมาก" และกำหนดหลักกฎหมายที่สามารถนำมาใช้กับคดี Cassidy ได้ มัวร์ต้องปฏิบัติตามกระบวนการใดในการพิจารณาว่าจะใช้คดี Zhu เป็นบรรทัดฐานหรือไม่?

มัวร์มีอิสระที่จะตัดสินคดีอย่างไรก็ได้ตามที่เขาต้องการ แต่เขาไม่สามารถพิจารณาคำตัดสินและเหตุผลในคดีที่คล้ายคลึงกันจากรัฐอื่นได้
มัวร์ต้องรอให้สภานิติบัญญัติและผู้ว่าการรัฐโคโลราโดผ่านกฎหมายที่เกี่ยวข้องกับประเด็นต่างๆ ที่เกิดขึ้นในคดีของแคสสิดีเสียก่อน
หากนั่นเป็นบรรทัดฐานที่ดีที่สุด มัวร์ต้องปฏิบัติตามคดีของรัฐแคลิฟอร์เนีย
มัวร์อาจปฏิบัติตามแนวทางของคดีในรัฐแคลิฟอร์เนีย หากเขาเชื่อว่าแนวทางดังกล่าวให้เหตุผลที่ดีที่สุดสำหรับคดีที่คล้ายคลึงกัน
