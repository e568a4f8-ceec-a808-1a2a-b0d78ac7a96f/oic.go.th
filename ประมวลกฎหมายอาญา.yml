อายุความ

Chapter 9
Prescription

มาตรา๙๕ในคดีอาญา ถ้ามิได้ฟ้องและได้ตัวผู้กระทำความผิดมายังศาลภายในกำหนดดังต่อไปนี้นับแต่วันกระทำความผิด เป็นอันขาดอายุความ	Section95.In a criminal case, if the institution is not made and the offender is not brought in person before[66] the court within the following limit reckoned from the day of the commission of the offence, [the prosecution] is barred by prescription:
(๑)ยี่สิบปี สำหรับความผิดต้องระวางโทษประหารชีวิต จำคุกตลอดชีวิต หรือจำคุกยี่สิบปี	(1)twenty years, for an offence which incurs a penalty of death, imprisonment for life, or imprisonment for twenty years;
(๒)สิบห้าปี สำหรับความผิดต้องระวางโทษจำคุกกว่าเจ็ดปีแต่ยังไม่ถึงยี่สิบปี	(2)fifteen years, for an offence which incurs a penalty of imprisonment beyond seven years but not still up to twenty years;
(๓)สิบปี สำหรับความผิดต้องระวางโทษจำคุกกว่าหนึ่งปีถึงเจ็ดปี	(3)ten years, for an offence which incurs a penalty of imprisonment beyond one year up to seven years;
(๔)ห้าปี สำหรับความผิดต้องระวางโทษจำคุกกว่าหนึ่งเดือนถึงหนึ่งปี	(4)five years, for an offence which incurs a penalty of imprisonment beyond one month up to one year;
(๕)หนึ่งปี สำหรับความผิดต้องระวางโทษจำคุกตั้งแต่หนึ่งเดือนลงมา หรือต้องระวางโทษอย่างอื่น	(5)one year, for an offence which incurs a penalty of imprisonment of[67] one month or lesser or incurs a different penalty.
ถ้าได้ฟ้องและได้ตัวผู้กระทำความผิดมายังศาลแล้ว ผู้กระทำความผิดหลบหนีหรือวิกลจริต และศาลสั่งงดการพิจารณาไว้จนเกินกำหนดดังกล่าวแล้วนับแต่วันที่หลบหนีหรือวันที่ศาลสั่งงดการพิจารณา ก็ให้ถือว่า เป็นอันขาดอายุความเช่นเดียวกัน	If[, after the case] has been instituted and the offender has been brought in person before the court, the offender escapes or becomes of unsound mind and the court orders the trial to be stayed until the said limit, reckoned from the day of the escape or the day of issuance by the court of the order staying the trial, is over, it shall be deemed that [the prosecution] is likewise barred by prescription.
มาตรา๙๖ภายใต้บังคับมาตรา ๙๕ ในกรณีความผิดอันยอมความได้ ถ้าผู้เสียหายมิได้ร้องทุกข์ภายในสามเดือนนับแต่วันที่รู้เรื่องความผิดและรู้ตัวผู้กระทำความผิด เป็นอันขาดอายุความ	Section96.Subject to section 95, if, in case of a compoundable offence, the injured person does not lodge a complaint within three months reckoned from the day [he] becomes aware of the offence and of the identity of the offender, [the prosecution] is barred by prescription.
มาตรา๙๗ในการฟ้องขอให้กักกัน ถ้าจะฟ้องภายหลังการฟ้องคดีอันเป็นมูลให้เกิดอำนาจฟ้องขอให้กักกัน ต้องฟ้องภายในกำหนดหกเดือนนับแต่วันที่ฟ้องคดีนั้น มิฉะนั้น เป็นอันขาดอายุความ	Section97.As regards the proceedings for incarceration,[68] if they are to be instituted after instituting the case grounding the power to institute [the proceedings] for incarceration, they must be instituted within a limit of six months reckoned from the day of instituting such case, or else they are barred by prescription.
มาตรา๙๘เมื่อได้มีคำพิพากษาถึงที่สุดให้ลงโทษผู้ใด ผู้นั้นยังมิได้รับโทษก็ดี ได้รับโทษแต่ยังไม่ครบถ้วนโดยหลบหนีก็ดี ถ้ายังมิได้ตัวผู้นั้นมาเพื่อรับโทษนับแต่วันที่มีคำพิพากษาถึงที่สุด หรือนับแต่วันที่ผู้กระทำความผิดหลบหนี แล้วแต่กรณี เกินกำหนดเวลาดังต่อไปนี้ เป็นอันล่วงเลยการลงโทษ จะลงโทษผู้นั้นมิได้	Section98.When there has been issued a final judgment imposing a penalty upon anyone [and] that one has not yet undergone the penalty [or] has undergone the penalty but has escaped prior to completing it, if that one cannot be brought in person to the penalty until expiry of the following time limit reckoned from the day of issuance of the final judgment or reckoned from the day of his escape,[69] the penalty is overdue [and] cannot be inflicted upon that one [any longer]:
(๑)ยี่สิบปี สำหรับโทษประหารชีวิต จำคุกตลอดชีวิต หรือจำคุกยี่สิบปี	(1)twenty years, for a penalty of death, imprisonment for life, or imprisonment for twenty years;
(๒)สิบห้าปี สำหรับโทษจำคุกกว่าเจ็ดปีแต่ยังไม่ถึงยี่สิบปี	(2)fifteen years, for a penalty of imprisonment beyond seven years but still not up to twenty years;
(๓)สิบปี สำหรับโทษจำคุกกว่าหนึ่งปีถึงเจ็ดปี	(3)ten years, for a penalty of imprisonment beyond one year up to seven years;
(๔)ห้าปี สำหรับโทษจำคุกตั้งแต่หนึ่งปีลงมา หรือโทษอย่างอื่น	(4)five years, for a penalty of imprisonment of[67] one year or lesser or a different penalty.
มาตรา๙๙การยึดทรัพย์สินใช้ค่าปรับหรือการกักขังแทนค่าปรับ ถ้ามิได้ทำภายในกำหนดห้าปีนับแต่วันที่ได้มีคำพิพากษาถึงที่สุด จะยึดทรัพย์สินหรือกักขังไม่ได้	Section99.[As regards] the seizure of property to cover a fine or the confinement [imposed] in lieu of a fine, if it is not carried out within a limit of five years reckoned from the day the final judgment is issued, the property cannot be seized or the confinement cannot be made [any longer].
ความในวรรคแรกมิให้ใช้บังคับในกรณีการกักขังแทนค่าปรับซึ่งทำต่อเนื่องกับการลงโทษจำคุก	The text of paragraph 1 shall not apply in case of the confinement in lieu of a fine which is carried out in continuation of the infliction of imprisonment.
มาตรา๑๐๐เมื่อได้มีคำพิพากษาถึงที่สุดให้กักกันผู้ใด ถ้าผู้นั้นยังมิได้รับการกักกันก็ดี ได้รับการกักกันแต่ยังไม่ครบถ้วนโดยหลบหนีก็ดี ถ้าพ้นกำหนดสามปีนับแต่วันที่พ้นโทษโดยได้รับโทษตามคำพิพากษาแล้ว โดยล่วงเลยการลงโทษ หรือนับแต่วันที่ผู้นั้นหลบหนีระหว่างเวลาที่ต้องกักกัน เป็นอันล่วงเลยการกักกัน จะกักกันผู้นั้นไม่ได้	Section100.When there has been issued a final judgment subjecting anyone to incarceration and[70] that one has not yet undergone the incarceration [or] has undergone the incarceration but has escaped prior to completing it, the incarceration is overdue [and] that one cannot be incarcerated [any longer] upon[70] expiry of the limit of three years reckoned from the day of [his] discharge from the penalty because [he] has already undergone the penalty according to the judgment or because the penalty has become overdue or reckoned from the day of his escape during the time of [his] incarceration.
มาตรา๑๐๑การบังคับตามคำสั่งของศาลตามความในมาตรา ๔๖ หรือการร้องขอให้ศาลสั่งให้ใช้เงินเมื่อผู้ทำทัณฑ์บนประพฤติผิดทัณฑ์บนตามความในมาตรา ๔๗ นั้น ถ้ามิได้บังคับหรือร้องขอภายในกำหนดสองปีนับแต่วันที่ศาลมีคำสั่งหรือนับแต่วันที่ผู้ทำทัณฑ์บนประพฤติผิดทัณฑ์บน จะบังคับหรือร้องขอมิได้	Section101.[As regards] the execution of the court order in accordance with the text of section 46 or the making of a request to the court for ordering a monetary payment when the person posting the bond breaches the bond in accordance with the text of section 47, if the execution or request is not made within a limit of two years reckoned from the day the court issues the order or reckoned from the day the person posting the bond breaches the bond, the execution or request cannot be made [any longer].
Notes
 The Thai text literally translates “a benefit which should not be obtained by [means] compatible with the law” and thus could be understood to mean that the benefit should be obtained by an unlawful means. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/6) says “to procure for himself or any other person any advantage to which he is not lawfully entitled”.
 Literally, “which people have legitimacy to go in”.
 Samnak-ngan Ratchabandittayasapha (2013) defines ruean (Thai: เรือน) as “a walled and roofed structure raised on stilts, used for residence; a residence”. In the English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/6), the term “house” was used.
 Samnak-ngan Ratchabandittayasapha (2013) defines rong (Thai: โรง) as “a roofed structure, usually situated on the ground, used for residence, conduct of business, or storage of things, for instance”. In the English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/6), the term “shed” was used.
 Samnak-ngan Ratchabandittayasapha (2013) defines phae (Thai: แพ) as (1) a raft (collection of logs, etc, fastened together for floating on water) and (2) “a ruean (residence) situated on a raft. In the English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/6), the term “floating house” was used.
 Literally, “using force to inflict injury”. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/6) says “to use violence”.
 Literally, “by using a drug to make [someone] giddy [or] tipsy”. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/6) says “by administering drugs to make him intoxicated”.
 See the note about the term ekkasan ratchakan (Thai: เอกสารราชการ), here translated as “governmental document”, in Translation:Act Amending the Penal Code (No. 12), 2535 BE.
 Literally, “a provision of a subsequently provided law”.
 Literally, “shall be discharged from the act of being an offender”. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/8) says “shall be free from being an offender”.
 Literally, “[related persons] shall use the law in the part which is favourable to the offender, regardless of in what way”.
 Literally, “when the file of the case appears to the court”.
 Literally, “The commission of an offence in a Thai vessel or Thai aircraft, irrespective of where[ver it] may be, shall be deemed as committing an offence in the Kingdom.”
 Originally, “in the event [of]”.
 Literally, “or commits an offence which this Code deems as having [been] committed in the Kingdom”.
 Literally, “the conditions to order that there be the application of such measure for safety”.
 The Thai text literally translates “if, later, khwam appears to [the] court [that]”. The term khwam (Thai: ความ) can mean (1) matter, affair; (2) legal matter, legal case, lawsuit. The phrase might be intended to mean “if the matter[/lawsuit?] which is later brought before the court [has it that]”. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/91) merely says “if it afterwards appears to the court [that]”.
 Literally, “shall [be] use[d] in cases of offences…also”. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/39) merely says “shall also apply to offences…”.
 The term kakkhang (Thai: กักขัง), here translated as “confinement”, is defined by Samnak-ngan Ratchabandittayasapha (2013) as “to force to be in a limited place; to keep in a limited place”. Etymologically, kakkhang is a compound consisting of kak (“to keep, to confine, etc”) and khang (having the same meaning). Samnak-ngan Ratchabandittayasapha (2016) says kankakkhang (Thai: การกักขัง), the noun form of the verb kakkhang, corresponds to “confinement” or “incarceration” in English. In the English draft of the Penal Code (Office of the Juridical Council, 1950b, p. 29/111), the term “arrest” was used for kakkhang.
 The Thai text literally translates “Anyone hit by a penalty of destroying the life shall be carried [away] to be shot up till death”. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/39) says “Whoever is sentenced to death shall be shot”.
 Literally, “[his] person shall be kept”.
 Literally, “In this regard, the court may designate any particular conditions to be performed by the person sentenced to confinement, or [may designate] no [conditions], [either] is fine, as the court may finds appropriate.”
 The Thai text literally translates “[if] khwam appears to the court itself or appears to the court according to a statement of…that…”. The term khwam (Thai: ความ) can mean (1) matter, affair; (2) legal matter, legal case, lawsuit. The phrase might be intended to mean “[if] the matter which comes to the knowledge of the court itself or the matter[/lawsuit?] which is brought before the court by a statement of…has it that…”. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/94) merely says “when it appears to the court itself or by the argument of…that…”
 Literally, “the court may order demanding security”.
 Literally, “In the event that a court is to [give a] judgment that several offenders be fined in the same offence in the same event, the court shall hand down the fine penalty by order of person individually”.
 Literally, “Any property [in respect of] which the law provides that anyone creating or possessing [it] constitutes an offence shall be confiscated away in whole, irrespective of whether [it] belongs to the offender and there is [any]one punished according to the judgment or not.”
 Originally, “these”.
 Literally, “for being a reward in the act of a person having committed an offence”.
 Originally, “but”.
 The term kakkan (Thai: กักกัน), here translated as “incarceration”, is defined by Samnak-ngan Ratchabandittayasapha (2013) as “to prohibit from going beyond an area designated; to designate an area for [someone] to be in”. Etymologically, kakkan is a compound consisting of kak (“to keep, to confine, etc”) and kan (“to separate, to isolate, etc”). Samnak-ngan Ratchabandittayasapha (2016) says kankakkan (Thai: การกักกัน), the noun form of the verb kakkan, corresponds to “internment” in English. In the English draft of the Penal Code (Office of the Juridical Council, 1950b, p. 29/111), the term “relegation” (perhaps from the archaic penalty of relégation in the French law) was used for kakkan. CNRTL (2012) defines the French term relégation as “a supplementary penalty imposed on recidivists, by which a convict is obliged to reside (individual relegation) or is interned (collective relegation) outside the metropolitan territory”.
 Literally, “not less than two times”.
 Originally, “time”.
 The Thai text literally translates “if khwam appears to a court according to a proposal of a public prosecutor [that]”. The term khwam (Thai: ความ) can mean (1) matter, affair; (2) legal matter, legal case, lawsuit. The phrase might be intended to mean “if the matter[/lawsuit?] which is brought before a court by a proposal of a public prosecutor [has it that]”. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/118) merely says “when it appears to the court according to the statements of the public prosecutor [that]”.
 See also the note about the terms chit bokphrong, rok chit, and chit fanfuean (Thai: จิตบกพร่อง, โรคจิต, and จิตฟั่นเฟือน), here translated respectively as “mental defect”, “mental disease”, and “mental disorder”, in Translation:Act Amending the Penal Code (No. 27), 2562 BE.
 The term sura (Thai: สุรา), here translated as “liquor”, only refers to distilled spirits, according to Samnak-ngan Ratchabandittayasapha (2013).
 Originally, “within”.
 See also the note about the term mattrasuan thot (Thai: มาตราส่วนโทษ), here translated as “scale of penalty”, in Translation:Act Amending the Penal Code (No. 21), 2551 BE.
 The Thai text here probably contains an error because it should be kamnot thot (Thai: กำหนดโทษ; “to designate the penalty”) rather than kamnot kanlong thot (Thai: กำหนดการลงโทษ; “to designate the carrying out of a penalty”). The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/91-1) says “If he does not comply with the condition imposed by the Court, the Court may issue a summons or warrant of arrest in order to caution him or to pass and inflict the punishment not yet passed on him or to have the punishment conditionally suspended inflicted on him.”
 Originally, “within the time”.
 The Thai text literally translates “shall [be] discharge[d] from the act of being about to incur the designation of the penalty or to incur the handing down of the penalty in that case, up to the event”. The English draft of the Penal Code (Office of the Juridical Council, 1950a, p. 28/94) says “shall be free from the sentence passed upon him or the infliction of punishment in that case, as the case may be”.
 The Thai text literally translates:
“A person will have to be liable in a criminal way only when [he] has committed [the act in question] with intent, except, however, [when he] has committed [it] by negligence in the event that the law provides that [he] be liable when [he] has committed [the act] by negligence or except, however, in the event that the law expressly provides that [he] be liable even [when he] has committed [the act] without intent.”
The English draft of the Penal Code (Office of the Juridical Council, 1950b, p. 29/2) says:
“An offender shall be punished only when he has committed the offence intentionally, except in the case where the law especially provides that the offender shall be punished even when [he] committed [the offence] by negligence, or in the case otherwise provided by law”.
 The Thai text literally translates:
“To commit [an act] with intent is to commit [an act] whilst being aware of the act that [one is] committing and, at the same time, the committing person desires the outcome, or does foresee the outcome, of that act.”
The English draft of the Penal Code (Office of the Juridical Council, 1950b, p. 29/2) says:
“A person is said to do an act intentionally if such person desired the doing of that act and desired or could foresee the effect of such doing”.
 The Thai text literally translates:
“To commit [an offence] by negligence is to commit an offence [in an manner] which is not with intent, but to commit [the offence] without care which a person in such a state must have according to [his] nature and circumstances and the person committing [the offence] might have been able to use such care but did not use [it] sufficiently.”
The English draft of the Penal Code (Office of the Juridical Council, 1950b, pp. 29/2 – 29/5) says:
“A person is said to do an act by negligence if such person does the act unintentionally, but does so without [exercising] such care as might be expected from its nature and circumstances and he could have exercised such care but did not do so sufficiently.”
 Literally, “in the event that a law provides specifically that, [for] that act, the committing person will need to receive the penalty, even [when] committing [it] by negligence”.
 Literally, “except, however, [when] such intoxication would have occurred without the consumer’s knowledge that that thing would cause [him] to be intoxicated or [when the consumer] has consumed [it] because [his] mind has been forced to consume [it]”.
 “Which cannot be avoided or resisted” may modify only “power” or both “direction” and “power”. The English draft of the Penal Code (Office of the Juridical Council, n.d., p. 16/34) says “(1) when he acts on account of the influence of a force which he is under and which is unable to avoid or resist”.
 The Thai text literally translates “if such commission is not an act beyond the appropriateness of [its] cause”. The English draft of the Penal Code (Office of the Juridical Council, n.d., p. 16/34) says “provided that no more is done than is reasonably required under the circumstances”.
 The Thai text literally translates “if [it] has been committed [in a manner that] fits the appropriateness of [its] cause”. The English draft of the Penal Code (Office of the Juridical Council, n.d., p. 16/34) says “provided that no more is done than is reasonably required under the circumstances”.
 The Thai text says mai mi khwamphit (Thai: ไม่มีความผิด), which literally translates “has no guilt”. The English draft of the Penal Code (Office of the Juridical Council, n.d., p. 16/34) says “shall not be punished”.
 The Thai text literally translates “if the committing person has committed [the act] more than the appropriateness of [its] cause[,] or more than the event of the necessity[,] or more than the event of the need to commit [the act] in order to protect [something]”. The English draft of the Penal Code (Office of the Juridical Council, n.d., p. 16/35) merely says “whenever…the act committed is in excess of what is reasonably required or permitted by law”.
 See also the note about the term tokchai (Thai: ตกใจ), here translated as “startle”, in Translation:Penal Code of Thailand/Division 3.
 Literally, “if [it] is the commission which a husband commits to the wife or a wife commits to the husband”.
 Literally, “or older or younger siblings sharing the same father and mother [and] committing [the offence] against each other”.
 The Thai text literally translates “[if] khwam appears to the court because the court knows [about it] itself or [appears to the court] according to a motion of an interest person…[that]”. The term khwam (Thai: ความ) can mean (1) matter, affair; (2) legal matter, legal case, lawsuit. The phrase might be intended to mean “[if] the matter[/lawsuit?] which is brought to the knowledge of the court, whether by the court itself or by a motion of an interest person…, [has it that]”.
 The compound chotkhlao (Thai: โฉดเขลา), here translated as “stupid”, consists of the following terms:
Chot, defined by Samnak-ngan Ratchabandittayasapha (2013) as “stupid or naive”. In actual usage, it can also mean “evil” or “wicked”, as in the phrase chai chot ying chua (Thai: ชายโฉดหญิงชั่ว; “wicked man, evil woman”) or chai chot (Thai: ใจโฉด; “evil mind”). Etymologically, it is from Old Khmer chota (“simple-minded”).
Khlao, defined by Samnak-ngan Ratchabandittayasapha (2013) as “slow-witted, uninformed, inexperienced, dull, unintelligent”. Etymologically, it is from Old Khmer khlova (meaning the same).
In modern usage, these terms are derogatory and offensive. In the English draft of the Penal Code (Office of the Juridical Council, n.d., p. 16/38), the phrase “defect of mind” was used.
 See also the note about the term baopanya (Thai: เบาปัญญา), literally translating “light wisdom”, here translated as “naive”, in Translation:Penal Code of Thailand/Division 2/Title 12.
 The phrase mi khun khwamdi ma tae kon (Thai: มีคุณความดีมาแต่ก่อน) consists of mi (“to have”), khun (“worth, excellence”), khwamdi (“goodness, virtue”), ma (a preposition indicating motion towards the speaker’s direction or that continues to a certain point of time), tae (“from, since”), and kon (“before, prior; earlier; past”). In the English draft of the Penal Code (Office of the Juridical Council, n.d., p. 16/38), the phrase “previous good conduct” was used.
 Lu kae thot (Thai: ลุแก่โทษ), here translated as “to admit the guilt”, is defined by Samnak-ngan Ratchabandittayasapha (2013) as “to confess [one’s] guilt and allow [oneself] to be punished [by someone] as [the latter] may find appropriate”. In the English draft of the Penal Code (Office of the Juridical Council, n.d., p. 16/38), the phrase “his voluntary surrender before the discovery of the offence” was used.
 The Thai text does not say what penalty it is referring to. No correction is found for this part.
 The Thai text literally translates:
“If there is a personal cause [for] which [there] should [be] the exemption of a penalty, the commutation of a penalty, or the aggravation of a penalty for any offender, applying that cause to [the] other offenders in the commission of that offence also is not allowed. But if the cause [for] which [there] should [be] the exemption of a penalty, the commutation of a penalty, or the aggravation of a penalty is a cause in the characteristics of the case, then [the cause] shall be applied to the offenders in the commission of that offence, all together.”
The Penal Code drafting archives contain several drafts for this section (Office of the Juridical Council, 1950b, pp. 29/21 – 29/22):
Draft	Original	Translation
1	Section 70.- The circumstances relating to the person of any offender, which exclude, lessen or aggravate the punishment shall apply only to the offenders concerned with such circumstances. The circumstances which relate to the nature of the offence shall apply to every person participating in the offence, whether he be principal or accessory.
2	มาตรา ๗๐ ความสัมพันธ์ คุณสมบัติ และพฤติการณ์ฉะเพาะตัวผู้กระทำความผิดคนใด ย่อมเป็นเหตุให้ยกเว้นโทษ ลดโทษ หรือเพิ่มโทษฉะเพาะตัวแก่ผู้กระทำความผิดคนนั้น พฤติการณ์อันเกี่ยวกับลักษณะของความผิดอันเป็นเหตุให้ยกเว้นโทษ ลดโทษ หรือเพิ่มเติม ให้มีผลแก่ผู้มีส่วนในความผิดนั้นทุกคน จะเป็นตัวการหรือผู้สนับสนุนก็ตาม	Section 70. The relationships, attributes, and circumstances personal to any offender do ground the exemption of a penalty, commutation of a penalty, or aggravation of a penalty for that offender personally. The circumstances which relate to the characteristics of an offence [and] which ground the exemption of a penalty, commutation of a penalty, or aggravation of a penalty, shall take effect for all those who have played a part in such offence, irrespective of whether they be principals or aiders.
3	มาตรา ๗๐ ผู้กระทำความผิดคนใดมีความสัมพันธ์ คุณสมบัติ หรือพฤติการณ์อันมีลักษณะฉะเพาะตัว ย่อมเป็นเหตุให้ยกเว้นโทษ ลดโทษ หรือเพิ่มโทษฉะเพาะตัวผู้กระทำความผิดคนนั้น	Section 70. [When] any offender has relationships, attributes, or circumstances with personal characteristics, [this] does ground the exemption of a penalty, commutation of a penalty, or aggravation of a penalty for that offender personally.
 Literally, “When any act which is one act is an offence against several legal provisions, the legal provision which has the heaviest penalty shall be used to hand down a penalty to the offender.” Compare section 52 of the German Criminal Code, which says: “Section 52 Several offences committed by one act (1) If the same act violates more than one criminal statute or the same criminal statute more than once, only one penalty is imposed. (2) If more than one criminal statute has been violated, the penalty is determined according to the statute which provides for the most severe penalty…” (Bohlander & Reusch, n.d.).
 The Thai text literally translates “then [the court] shall aggravate the penalty which is to be handed down to that one, one…of the penalty which the court designates for the offence on the subsequent occasion”. The English draft of the Penal Code says “the Court shall have the punishment to be inflicted for the subsequent offence, if it be imprisonment, increased by one…” (Office of the Juridical Council, 1950b, p. 29/23).
 Literally, “and if [he] has committed any kind of the offences as set out in the following subsections again in the same subsection again”.
 Literally, “if the first offence is an offence [for] which the court gave a judgment imposing a penalty of imprisonment not less than six months, if the court is going to give a judgment imposing a penalty as serious as imprisonment on the subsequent occasion”.
 See also the note about the term sap (Thai: ทรัพย์), here translated as capitalised “Thing”, in Translation:Penal Code of Thailand/Division 3.
 Literally, “and the person of the offender is gotten into”.
 Originally, “as from”.
 Literally, “in instituting for incarceration”.
 Literally, “if still not able to get the person of that one for undergoing the penalty reckoned from the day that there was issued the final judgment or reckoned from the day that the one committing the offence escaped”.
 Originally, “if”.
